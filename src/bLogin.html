<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial System - Login</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

    :root {
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --brand-light: #3b82f6;
      --purple: #7c3aed;
      --purple-dark: #5b21b6;
      --accent: #0f172a;
      --ink: #0f172a;
      --muted: #64748b;
      --panel: #ffffff;
      --bg: #f8fafc;
      --bg-secondary: #f1f5f9;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.05) 0%, transparent 25%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.05) 0%, transparent 25%);
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    .login-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 28px;
      box-shadow:
        0 50px 100px -20px rgba(50, 50, 93, 0.25),
        0 30px 60px -30px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      overflow: hidden;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(20px);
    }

    .login-brand {
      padding: 64px 56px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-brand::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 28px;
      width: fit-content;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
      color: #ffffff;
      letter-spacing: -0.03em;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
    }

    .brand-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 17px;
      max-width: 420px;
      line-height: 1.7;
      position: relative;
      z-index: 1;
      font-weight: 400;
    }

    .brand-shape {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
      bottom: -150px;
      right: -150px;
      animation: float 6s ease-in-out infinite;
    }

    .brand-shape::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
      top: -100px;
      left: -100px;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-20px, -20px); }
    }

    .login-card {
      padding: 64px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: #ffffff;
    }

    .card-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: -8px;
    }

    .alert {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-warning {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border: 1px solid #fed7aa;
      color: #9a3412;
    }

    .alert-error {
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: #fafbfc;
      font-weight: 500;
    }

    input:focus {
      border-color: var(--brand);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      transform: translateY(-1px);
    }

    input:hover {
      border-color: #cbd5e1;
      background: #ffffff;
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:
        0 4px 15px rgba(102, 126, 234, 0.4),
        0 0 0 0 rgba(102, 126, 234, 0.5);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-login::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn-login:hover::before {
      opacity: 1;
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow:
        0 12px 24px rgba(102, 126, 234, 0.5),
        0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .btn-login:active {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      transform: none;
    }

    .btn-login:disabled:hover {
      transform: none;
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-login.loading .spinner {
      display: inline-block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .footer-text {
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      font-weight: 500;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 820px) {
      .login-shell {
        grid-template-columns: 1fr;
        max-width: 480px;
        border-radius: 24px;
      }

      .login-brand {
        padding: 48px 32px;
      }

      .brand-title {
        font-size: 36px;
      }

      .brand-subtitle {
        font-size: 15px;
      }

      .login-card {
        padding: 40px 32px;
      }

      .card-title {
        font-size: 24px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-brand {
        padding: 40px 24px;
      }

      .brand-title {
        font-size: 32px;
      }

      .login-card {
        padding: 32px 24px;
      }

      .card-title {
        font-size: 22px;
      }

      input {
        padding: 13px 14px;
        font-size: 16px;
      }

      .btn-login {
        padding: 15px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-brand">
      <div class="brand-chip">SECURE FINANCE</div>
      <h1 class="brand-title">Financial System</h1>
      <p class="brand-subtitle">Control cashflow, monitor budgets, and keep your books ready.</p>
      <div class="brand-shape"></div>
    </div>

    <div class="login-card">
      <div>
        <div class="card-title">Sign in</div>
        <div class="card-subtitle">Use your email and 4-digit PIN.</div>
      </div>

      <div id="sessionExpiredAlert" class="alert alert-warning">
        Session expired. Please login again.
      </div>

      <div id="errorAlert" class="alert alert-error">
        <span id="errorMessage"></span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="pin">PIN (4 digits)</label>
          <input
            type="password"
            id="pin"
            placeholder="0000"
            required
            maxlength="4"
            pattern="[0-9]{4}"
            inputmode="numeric"
            autocomplete="off"
          />
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          <span class="spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="footer-text">Powered by Google Apps Script</div>
    </div>
  </div>

  <script>
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('expired') === 'true') {
        showSessionExpired();
      }
    };

    function showSessionExpired() {
      const alert = document.getElementById('sessionExpiredAlert');
      alert.style.display = 'block';
      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    function showError(message) {
      const alert = document.getElementById('errorAlert');
      const messageEl = document.getElementById('errorMessage');
      messageEl.textContent = message;
      alert.style.display = 'block';

      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const loginBtn = document.getElementById('loginBtn');

      if (!/^\d{4}$/.test(pin)) {
        showError('PIN must be exactly 4 digits');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            // Flag the login so the dashboard can retry while the session propagates.
            sessionStorage.setItem('justLoggedIn', '1');

            // Load the dashboard HTML and write it so scripts execute.
            google.script.run
              .withSuccessHandler(function(dashboardHtml) {
                document.open();
                document.write(dashboardHtml);
                document.close();

                // Ensure the dashboard initializes even if onload doesn't fire.
                if (typeof initializeDashboard === 'function') {
                  initializeDashboard();
                } else {
                  setTimeout(function() {
                    if (typeof initializeDashboard === 'function') {
                      initializeDashboard();
                    }
                  }, 0);
                }
              })
              .withFailureHandler(function(error) {
                showError('Could not load dashboard. Please reload.');
                console.error('Dashboard loading error:', error);
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
              })
              .getDashboardHtml();
          } else {
            showError(result.message || 'Login failed. Please try again.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
          }
        })
        .withFailureHandler(function(error) {
          showError('An error occurred. Please try again.');
          console.error('Login error:', error);
          loginBtn.disabled = false;
          loginBtn.classList.remove('loading');
        })
        .authenticateUser(email, pin);
    }

    document.getElementById('pin').addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>
