<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial System - Login</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

    :root {
      --brand: #2ca01c;
      --brand-dark: #187a0f;
      --brand-light: #37b828;
      --accent: #10b981;
      --ink: #0f172a;
      --muted: #64748b;
      --panel: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #e8f8ef 0%, #f7faf8 45%, #eef6f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .login-shell {
      width: 100%;
      max-width: 1000px;
      background: var(--panel);
      border-radius: 24px;
      box-shadow: var(--shadow-xl);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      overflow: hidden;
      animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-brand {
      padding: 56px 48px;
      background: linear-gradient(160deg, #e9f9ef 0%, #f3fbff 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #def3e1;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-dark);
      margin-bottom: 24px;
      width: fit-content;
    }

    .brand-title {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 16px;
      max-width: 360px;
      line-height: 1.6;
    }

    .brand-shape {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(44, 160, 28, 0.15) 0%, rgba(44, 160, 28, 0) 70%);
      bottom: -100px;
      right: -100px;
    }

    .brand-shape::before {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(44, 160, 28, 0.1) 0%, rgba(44, 160, 28, 0) 70%);
      top: -120px;
      left: -80px;
    }

    .login-card {
      padding: 48px 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
    }

    .card-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .alert {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .alert-warning {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--ink);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: #ffffff;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(44, 160, 28, 0.1);
    }

    input:hover {
      border-color: var(--muted);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(44, 160, 28, 0.3);
      background: linear-gradient(135deg, var(--brand-light) 0%, var(--brand) 100%);
    }

    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-login.loading .spinner {
      display: inline-block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .footer-text {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .login-shell {
        grid-template-columns: 1fr;
      }

      .login-brand {
        padding: 36px;
      }

      .login-card {
        padding: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-brand">
      <div class="brand-chip">SECURE FINANCE</div>
      <h1 class="brand-title">Financial System</h1>
      <p class="brand-subtitle">Control cashflow, monitor budgets, and keep your books ready.</p>
      <div class="brand-shape"></div>
    </div>

    <div class="login-card">
      <div>
        <div class="card-title">Sign in</div>
        <div class="card-subtitle">Use your email and 4-digit PIN.</div>
      </div>

      <div id="sessionExpiredAlert" class="alert alert-warning">
        Session expired. Please login again.
      </div>

      <div id="errorAlert" class="alert alert-error">
        <span id="errorMessage"></span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="pin">PIN (4 digits)</label>
          <input
            type="password"
            id="pin"
            placeholder="0000"
            required
            maxlength="4"
            pattern="[0-9]{4}"
            inputmode="numeric"
            autocomplete="off"
          />
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          <span class="spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="footer-text">Powered by Google Apps Script</div>
    </div>
  </div>

  <script>
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('expired') === 'true') {
        showSessionExpired();
      }
    };

    function showSessionExpired() {
      const alert = document.getElementById('sessionExpiredAlert');
      alert.style.display = 'block';
      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    function showError(message) {
      const alert = document.getElementById('errorAlert');
      const messageEl = document.getElementById('errorMessage');
      messageEl.textContent = message;
      alert.style.display = 'block';

      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const loginBtn = document.getElementById('loginBtn');

      if (!/^\d{4}$/.test(pin)) {
        showError('PIN must be exactly 4 digits');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            sessionStorage.setItem('justLoggedIn', '1');
            waitForSession(0);
          } else {
            showError(result.message || 'Login failed. Please try again.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
          }
        })
        .withFailureHandler(function(error) {
          showError('An error occurred. Please try again.');
          console.error('Login error:', error);
          loginBtn.disabled = false;
          loginBtn.classList.remove('loading');
        })
        .authenticateUser(email, pin);
    }

    function waitForSession(attempt) {
      const tries = attempt || 0;
      const target = window.location.origin + window.location.pathname + '?t=' + Date.now();

      google.script.run
        .withSuccessHandler(function(user) {
          if (user && user.authenticated) {
            // Session confirmed, redirect to dashboard
            window.location.replace(target);
            return;
          }

          if (tries >= 15) {
            // Max retries reached, force reload
            window.location.replace(target);
            return;
          }

          // Keep polling for session
          setTimeout(function() {
            waitForSession(tries + 1);
          }, 500);
        })
        .withFailureHandler(function(error) {
          console.error('Session check failed:', error);
          if (tries >= 15) {
            window.location.replace(target);
          } else {
            setTimeout(function() {
              waitForSession(tries + 1);
            }, 500);
          }
        })
        .getCurrentUser();
    }

    document.getElementById('pin').addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>
