<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial System - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      width: 100%;
      max-width: 420px;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .app-subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .alert {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .alert-warning {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1e293b;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5f5;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-login.loading .spinner {
      display: inline-block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .footer-text {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1 class="app-title">Financial System</h1>
    <p class="app-subtitle">Sign in to continue</p>

    <div id="sessionExpiredAlert" class="alert alert-warning">
      Session expired. Please login again.
    </div>

    <div id="errorAlert" class="alert alert-error">
      <span id="errorMessage"></span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="name@example.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="pin">PIN (4 digits)</label>
        <input
          type="password"
          id="pin"
          placeholder="0000"
          required
          maxlength="4"
          pattern="[0-9]{4}"
          inputmode="numeric"
          autocomplete="off"
        />
      </div>

      <button type="submit" id="loginBtn" class="btn-login">
        <span class="spinner"></span>
        <span class="btn-text">Sign In</span>
      </button>
    </form>

    <div class="footer-text">
      Secure Authentication | Powered by Google Apps Script
    </div>
  </div>

  <script>
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('expired') === 'true') {
        showSessionExpired();
      }
    };

    function showSessionExpired() {
      const alert = document.getElementById('sessionExpiredAlert');
      alert.style.display = 'block';
      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    function showError(message) {
      const alert = document.getElementById('errorAlert');
      const messageEl = document.getElementById('errorMessage');
      messageEl.textContent = message;
      alert.style.display = 'block';

      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const loginBtn = document.getElementById('loginBtn');

      if (!/^\d{4}$/.test(pin)) {
        showError('PIN must be exactly 4 digits');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            window.location.reload();
          } else {
            showError(result.message || 'Login failed. Please try again.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
          }
        })
        .withFailureHandler(function(error) {
          showError('An error occurred. Please try again.');
          console.error('Login error:', error);
          loginBtn.disabled = false;
          loginBtn.classList.remove('loading');
        })
        .authenticateUser(email, pin);
    }

    document.getElementById('pin').addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>
