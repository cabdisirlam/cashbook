<style>
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-content {
    width: 100%;
    max-width: 900px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .submodal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 2100;
  }

  .submodal.open {
    display: flex;
  }

  .submodal-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.2);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .submodal-header {
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .submodal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .select-field {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    background: #ffffff;
  }

  .form-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
  }

  .close-btn {
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #64748b;
  }

  .form-body {
    padding: 18px 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #0f172a;
  }

  .input-field,
  .input-field[readonly] {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
  }

  .input-field:focus {
    outline: none;
    border-color: #0ea5e9;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
  }

  .input-action {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    align-items: center;
  }

  .btn-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    font-weight: 700;
    cursor: pointer;
    color: #0f172a;
  }

  .split-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
  }

  .split-table thead {
    background: #f1f5f9;
    font-weight: 700;
    text-align: left;
  }

  .split-table th,
  .split-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #e2e8f0;
    vertical-align: top;
  }

  .split-table td .input-field {
    padding: 8px 10px;
    font-size: 12px;
  }

  .table-actions {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
  }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-primary {
    background: #16a34a;
    color: #ffffff;
  }

  .btn-secondary {
    background: #e2e8f0;
    color: #0f172a;
  }

  .btn-danger {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
    padding: 8px 10px;
  }

  .form-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-top: 1px solid #e2e8f0;
    background: #f8fafc;
  }

  .total-amount {
    font-size: 18px;
    font-weight: 800;
    color: #0f172a;
  }

  .status-text {
    padding: 6px 0 0;
    font-size: 12px;
    color: #64748b;
  }

  @media (max-width: 780px) {
    .split-table thead {
      display: none;
    }

    .split-table,
    .split-table tbody,
    .split-table tr,
    .split-table td {
      display: block;
      width: 100%;
    }

    .split-table tr {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
  }
</style>

<div class="modal-overlay" id="paymentModal">
  <div class="modal-content">
    <div class="form-header">
      <span id="transactionTitle">Record Payment</span>
      <button class="close-btn" type="button" onclick="closePaymentModal()">X</button>
    </div>

    <div class="form-body">
      <div class="grid">
        <div>
          <label class="form-label" for="txnDate">Date</label>
          <input type="date" id="txnDate" class="input-field" required>
        </div>
        <div>
          <label class="form-label" for="accountCode">Bank Account</label>
          <div class="input-action">
            <input list="accountList" id="accountCode" class="input-field" placeholder="Select account" required>
            <button class="btn-icon" type="button" onclick="openAddAccountModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="payee">Payee</label>
          <div class="input-action">
            <input list="payeeList" id="payee" class="input-field" placeholder="Select payee">
            <button class="btn-icon" type="button" onclick="openAddPayeeModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="refNo">Ref No</label>
          <input type="text" id="refNo" class="input-field" placeholder="Cheque 001 / Mpesa Ref">
        </div>
      </div>

      <table class="split-table">
        <thead>
          <tr>
            <th>Sub-Category</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="splitBody"></tbody>
      </table>

      <div class="table-actions">
        <button class="btn btn-secondary" type="button" onclick="addLine()">Add Line</button>
      </div>

      <div class="status-text" id="statusText"></div>
    </div>

    <div class="form-footer">
      <div class="total-amount">Total: <span id="totalAmount">0.00</span></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" type="button" onclick="closePaymentModal()">Cancel</button>
        <button class="btn btn-primary" type="button" onclick="saveTransaction()">Save</button>
      </div>
    </div>
  </div>
</div>

<datalist id="accountList"></datalist>
<datalist id="payeeList"></datalist>
<datalist id="subCatList"></datalist>
<datalist id="categoryList"></datalist>

<script>
  const paymentState = {
    accounts: [],
    payees: [],
    subCats: [],
    subToCatMap: {}
  };
  let transactionMode = 'Payment';

  function openPaymentModal() {
    transactionMode = 'Payment';
    setTransactionTitle();
    document.getElementById('paymentModal').style.display = 'flex';
    setDefaultDate();
    loadDropdowns();
    if (!document.getElementById('splitBody').children.length) {
      addLine();
    }
  }

  function openReceiptModal() {
    transactionMode = 'Receipt';
    setTransactionTitle();
    document.getElementById('paymentModal').style.display = 'flex';
    setDefaultDate();
    loadDropdowns();
    if (!document.getElementById('splitBody').children.length) {
      addLine();
    }
  }

  function closePaymentModal() {
    document.getElementById('paymentModal').style.display = 'none';
  }

  function setTransactionTitle() {
    const title = transactionMode === 'Receipt' ? 'Record Receipt' : 'Record Payment';
    const titleEl = document.getElementById('transactionTitle');
    if (titleEl) titleEl.textContent = title;
  }

  function setDefaultDate() {
    document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];
  }

  function loadDropdowns() {
    setStatus('Loading master data...');
    if (!google || !google.script || !google.script.run) {
      setStatus('App runtime missing. Open via the deployed URL.');
      return;
    }

    google.script.run
      .withSuccessHandler(function(data) {
        const payload = data || {};
        paymentState.accounts = payload.accounts || [];
        paymentState.payees = payload.payees || [];
        paymentState.subCats = payload.subCats || [];
        paymentState.subToCatMap = payload.subToCatMap || {};

        fillList('accountList', paymentState.accounts);
        fillList('payeeList', paymentState.payees);
        fillList('subCatList', paymentState.subCats);
        fillList('categoryList', payload.categories || []);
        setStatus('');
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to load master data.');
      })
      .getDropdownData();
  }

  function fillList(id, items) {
    const list = document.getElementById(id);
    list.innerHTML = '';
    (items || []).forEach(function(item) {
      const option = document.createElement('option');
      option.value = item;
      list.appendChild(option);
    });
  }

  function addLine() {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <div class="input-action">
          <input list="subCatList" class="input-field subcat-input" placeholder="Sub-category">
          <button class="btn-icon" type="button" onclick="openAddSubCategoryModal()">+</button>
        </div>
      </td>
      <td><input type="text" class="input-field category-input" readonly></td>
      <td><input type="text" class="input-field desc-input" placeholder="Description"></td>
      <td><input type="number" class="input-field amount-input" min="0" step="0.01" placeholder="0.00"></td>
      <td><button class="btn btn-danger" type="button" onclick="removeLine(this)">Delete</button></td>
    `;

    row.querySelector('.subcat-input').addEventListener('change', function() {
      const sub = this.value.trim();
      row.querySelector('.category-input').value = paymentState.subToCatMap[sub] || '';
    });

    row.querySelector('.amount-input').addEventListener('input', updateTotal);

    document.getElementById('splitBody').appendChild(row);
  }

  function removeLine(button) {
    const row = button.closest('tr');
    if (row) row.remove();
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    document.querySelectorAll('.amount-input').forEach(function(input) {
      const value = parseFloat(input.value);
      if (!isNaN(value)) total += value;
    });
    document.getElementById('totalAmount').textContent = total.toFixed(2);
  }

  function openAddAccountModal() {
    document.getElementById('addAccountInput').value = '';
    document.getElementById('addAccountType').value = '';
    document.getElementById('addAccountReport').value = '';
    document.getElementById('addAccountModal').classList.add('open');
    document.getElementById('addAccountInput').focus();
  }

  function openAddPayeeModal() {
    document.getElementById('addPayeeInput').value = '';
    document.getElementById('addPayeeModal').classList.add('open');
    document.getElementById('addPayeeInput').focus();
  }

  function openAddSubCategoryModal() {
    document.getElementById('addSubName').value = '';
    document.getElementById('addSubCategory').value = '';
    document.getElementById('addSubAccountType').value = '';
    document.getElementById('addSubReport').value = '';
    document.getElementById('addSubModal').classList.add('open');
    document.getElementById('addSubName').focus();
  }

  function closeSubModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function saveNewAccount() {
    const value = document.getElementById('addAccountInput').value.trim();
    const accountType = document.getElementById('addAccountType').value.trim();
    const reportMapping = document.getElementById('addAccountReport').value.trim();
    if (!value || !accountType || !reportMapping) return;

    setStatus('Saving master data...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addAccountModal');
        loadDropdowns();
        setStatus('Master data saved.');
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add master data.');
      })
      .addMasterItem('account', value, '', accountType, reportMapping);
  }

  function saveNewPayee() {
    const value = document.getElementById('addPayeeInput').value.trim();
    if (!value) return;

    setStatus('Saving master data...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addPayeeModal');
        loadDropdowns();
        setStatus('Master data saved.');
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add master data.');
      })
      .addMasterItem('payee', value);
  }

  function saveNewSubCategory() {
    const name = document.getElementById('addSubName').value.trim();
    const parent = document.getElementById('addSubCategory').value.trim();
    const accountType = document.getElementById('addSubAccountType').value.trim();
    const reportMapping = document.getElementById('addSubReport').value.trim();
    if (!name || !parent || !accountType || !reportMapping) return;

    setStatus('Saving sub-category...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addSubModal');
        loadDropdowns();
        setStatus('Sub-category saved.');
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add sub-category.');
      })
      .addMasterItem('subCategory', name, parent, accountType, reportMapping);
  }

  function saveTransaction() {
    const header = {
      date: document.getElementById('txnDate').value,
      accountCode: document.getElementById('accountCode').value.trim(),
      payee: document.getElementById('payee').value.trim(),
      refNo: document.getElementById('refNo').value.trim()
    };

    const rows = [];
    document.querySelectorAll('#splitBody tr').forEach(function(row) {
      const subCategory = row.querySelector('.subcat-input').value.trim();
      const category = row.querySelector('.category-input').value.trim();
      const description = row.querySelector('.desc-input').value.trim();
      const amount = parseFloat(row.querySelector('.amount-input').value);

      if (!subCategory && !category && !description && isNaN(amount)) return;

      rows.push({
        subCategory: subCategory,
        category: category,
        description: description,
        amount: amount
      });
    });

    if (!header.date || !header.accountCode) {
      setStatus('Date and Bank Account are required.');
      return;
    }

    if (!rows.length) {
      setStatus('Add at least one line.');
      return;
    }

    setStatus('Saving payment...');
    google.script.run
      .withSuccessHandler(function() {
        setStatus('Payment saved.');
        resetPaymentForm();
        closePaymentModal();
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to save payment.');
      })
      .saveTransaction({ header: header, rows: rows, type: transactionMode });
  }

  function resetPaymentForm() {
    document.getElementById('splitBody').innerHTML = '';
    document.getElementById('accountCode').value = '';
    document.getElementById('payee').value = '';
    document.getElementById('refNo').value = '';
    document.getElementById('totalAmount').textContent = '0.00';
    setDefaultDate();
  }

  function setStatus(message) {
    document.getElementById('statusText').textContent = message || '';
  }
</script>
<div class="submodal" id="addAccountModal">
  <div class="submodal-card">
    <div class="submodal-header">
      <span>Add Bank Account</span>
      <button class="close-btn" type="button" onclick="closeSubModal('addAccountModal')">X</button>
    </div>
    <div>
      <label class="form-label" for="addAccountInput">Account Code</label>
      <input id="addAccountInput" class="input-field" type="text" placeholder="e.g. EQUITY_MAIN">
    </div>
    <div>
      <label class="form-label" for="addAccountType">Account Type</label>
      <select id="addAccountType" class="select-field">
        <option value="">Select account type</option>
        <option value="Asset">Asset</option>
        <option value="Liabilities">Liabilities</option>
        <option value="Income">Income</option>
        <option value="Expense">Expense</option>
        <option value="Equity">Equity</option>
      </select>
    </div>
    <div>
      <label class="form-label" for="addAccountReport">Report Mapping</label>
      <select id="addAccountReport" class="select-field">
        <option value="">Select report mapping</option>
        <option value="Current Asset">Current Asset</option>
        <option value="Current liability">Current liability</option>
        <option value="Operating expense">Operating expense</option>
        <option value="Non-Current Asset">Non-Current Asset</option>
      </select>
    </div>
    <div class="submodal-actions">
      <button class="btn btn-secondary" type="button" onclick="closeSubModal('addAccountModal')">Cancel</button>
      <button class="btn btn-primary" type="button" onclick="saveNewAccount()">Save</button>
    </div>
  </div>
</div>

<div class="submodal" id="addPayeeModal">
  <div class="submodal-card">
    <div class="submodal-header">
      <span>Add Payee</span>
      <button class="close-btn" type="button" onclick="closeSubModal('addPayeeModal')">X</button>
    </div>
    <div>
      <label class="form-label" for="addPayeeInput">Payee Name</label>
      <input id="addPayeeInput" class="input-field" type="text" placeholder="Supplier or staff name">
    </div>
    <div class="submodal-actions">
      <button class="btn btn-secondary" type="button" onclick="closeSubModal('addPayeeModal')">Cancel</button>
      <button class="btn btn-primary" type="button" onclick="saveNewPayee()">Save</button>
    </div>
  </div>
</div>

<div class="submodal" id="addSubModal">
  <div class="submodal-card">
    <div class="submodal-header">
      <span>Add Sub-Category</span>
      <button class="close-btn" type="button" onclick="closeSubModal('addSubModal')">X</button>
    </div>
    <div>
      <label class="form-label" for="addSubName">Sub-Category Name</label>
      <input id="addSubName" class="input-field" type="text" placeholder="e.g. Fuel">
    </div>
    <div>
      <label class="form-label" for="addSubCategory">Category</label>
      <input list="categoryList" id="addSubCategory" class="input-field" type="text" placeholder="e.g. Transport">
    </div>
    <div>
      <label class="form-label" for="addSubAccountType">Account Type</label>
      <select id="addSubAccountType" class="select-field">
        <option value="">Select account type</option>
        <option value="Asset">Asset</option>
        <option value="Liabilities">Liabilities</option>
        <option value="Income">Income</option>
        <option value="Expense">Expense</option>
        <option value="Equity">Equity</option>
      </select>
    </div>
    <div>
      <label class="form-label" for="addSubReport">Report Mapping</label>
      <select id="addSubReport" class="select-field">
        <option value="">Select report mapping</option>
        <option value="Current Asset">Current Asset</option>
        <option value="Current liability">Current liability</option>
        <option value="Operating expense">Operating expense</option>
        <option value="Non-Current Asset">Non-Current Asset</option>
      </select>
    </div>
    <div class="submodal-actions">
      <button class="btn btn-secondary" type="button" onclick="closeSubModal('addSubModal')">Cancel</button>
      <button class="btn btn-primary" type="button" onclick="saveNewSubCategory()">Save</button>
    </div>
  </div>
</div>
</body>
</html>
