<style>
  @keyframes modalFadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes modalSlideUp {
    from {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal-overlay[style*="flex"] {
    animation: modalFadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .modal-overlay[style*="flex"] .modal-content {
    animation: modalSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .modal-content {
    width: 90%;
    max-width: 800px;
    max-height: 90vh;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    border: 1px solid rgba(226, 232, 240, 0.8);
    margin: 20px;
  }

  .submodal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 2100;
    backdrop-filter: blur(4px);
  }

  .submodal.open {
    display: flex;
    animation: modalFadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .submodal.open .submodal-card {
    animation: modalSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .submodal-card {
    width: 90%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    border: 1px solid rgba(226, 232, 240, 0.8);
    margin: 20px;
  }

  .submodal-header {
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: -0.02em;
  }

  .submodal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .select-field {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    background: #ffffff;
  }

  .form-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    border-bottom: 1px solid #e2e8f0;
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
  }

  .close-btn {
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #64748b;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .close-btn:hover {
    background: #e2e8f0;
    color: #0f172a;
  }

  .form-body {
    padding: 16px 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #0f172a;
  }

  .input-field,
  .input-field[readonly] {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    background: #ffffff;
  }

  .input-field:focus {
    outline: none;
    border-color: #2ca01c;
    box-shadow: 0 0 0 4px rgba(44, 160, 28, 0.12);
  }

  .input-field:hover:not([readonly]) {
    border-color: #94a3b8;
  }

  .input-field[readonly] {
    background: #f8fafc;
    color: #64748b;
  }

  .input-action {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    align-items: center;
  }

  .btn-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    font-weight: 700;
    cursor: pointer;
    color: #0f172a;
  }

  .split-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
  }

  .split-table thead {
    background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    font-weight: 600;
    text-align: left;
  }

  .split-table th,
  .split-table td {
    padding: 12px 14px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: middle;
  }

  .split-table th {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
  }

  .split-table tbody tr {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .split-table tbody tr:hover {
    background: #f8fafc;
  }

  .split-table tbody tr:last-child td {
    border-bottom: none;
  }

  .split-table td .input-field {
    padding: 8px 10px;
    font-size: 12px;
  }

  .table-actions {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: -0.01em;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }

  .btn-primary {
    background: linear-gradient(135deg, #2ca01c 0%, #187a0f 100%);
    color: #ffffff;
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, #37b828 0%, #2ca01c 100%);
  }

  .btn-secondary {
    background: #f1f5f9;
    color: #0f172a;
    border: 1px solid #e2e8f0;
  }

  .btn-secondary:hover {
    background: #ffffff;
    border-color: #94a3b8;
  }

  .btn-danger {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }

  .btn-danger:hover {
    background: #fecaca;
    border-color: #fca5a5;
  }

  .form-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-top: 1px solid #e2e8f0;
    background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
  }

  .total-amount {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
  }

  .status-text {
    padding: 6px 0 0;
    font-size: 12px;
    color: #64748b;
  }

  @media (max-width: 780px) {
    .modal-content {
      width: 95%;
      margin: 10px;
      max-height: 95vh;
    }

    .submodal-card {
      width: 95%;
      padding: 14px;
      margin: 10px;
    }

    .form-header {
      padding: 12px 14px;
      font-size: 16px;
    }

    .form-body {
      padding: 12px 14px;
    }

    .form-footer {
      padding: 12px 14px;
    }

    .total-amount {
      font-size: 18px;
    }

    .split-table thead {
      display: none;
    }

    .split-table,
    .split-table tbody,
    .split-table tr,
    .split-table td {
      display: block;
      width: 100%;
    }

    .split-table tr {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
  }
</style>

<div class="modal-overlay" id="paymentModal">
  <div class="modal-content">
    <div class="form-header">
      <span id="transactionTitle">Record Payment</span>
      <button class="close-btn" type="button" onclick="closePaymentModal()">X</button>
    </div>

    <div class="form-body">
      <div class="grid">
        <div>
          <label class="form-label" for="txnDate">Date</label>
          <input type="date" id="txnDate" class="input-field" required>
        </div>
        <div>
          <label class="form-label" for="txnFinancialYear">Financial Year</label>
          <div class="input-action">
            <input list="financialYearList" id="txnFinancialYear" class="input-field" placeholder="FY 2024/2025" required>
            <button class="btn-icon" type="button" onclick="openAddFinancialYearModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="accountCode">Bank Account</label>
          <div class="input-action">
            <input list="accountList" id="accountCode" class="input-field" placeholder="Select account" required>
            <button class="btn-icon" type="button" onclick="openAddAccountModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="payee">Payee</label>
          <div class="input-action">
            <input list="payeeList" id="payee" class="input-field" placeholder="Select payee">
            <button class="btn-icon" type="button" onclick="openAddPayeeModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="refNo">Ref No</label>
          <input type="text" id="refNo" class="input-field" placeholder="Cheque 001 / Mpesa Ref">
        </div>
      </div>

      <table class="split-table">
        <thead>
          <tr>
            <th>Particulars</th>
            <th>Sub-Category</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="splitBody"></tbody>
      </table>

      <div class="table-actions">
        <button class="btn btn-secondary" type="button" onclick="addLine()">Add Line</button>
      </div>

      <div class="status-text" id="statusText"></div>
    </div>

    <div class="form-footer">
      <div class="total-amount">Total: <span id="totalAmount">0.00</span></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" type="button" onclick="closePaymentModal()">Cancel</button>
        <button class="btn btn-primary" type="button" onclick="saveTransaction()">Save</button>
      </div>
    </div>
  </div>
</div>

<datalist id="accountList"></datalist>
<datalist id="payeeList"></datalist>
<datalist id="particularList"></datalist>
<datalist id="subCatList"></datalist>
<datalist id="categoryList"></datalist>
<datalist id="financialYearList"></datalist>

<script>
  const paymentState = {
    accounts: [],
    payees: [],
    particulars: [],
    subCats: [],
    subToCatMap: {},
    particularMeta: {}
  };
  let transactionMode = 'Payment';
  let isSaving = false;

  function openPaymentModal() {
    transactionMode = 'Payment';
    setTransactionTitle();
    document.getElementById('paymentModal').style.display = 'flex';
    setDefaultDate();
    loadDropdowns();
    if (!document.getElementById('splitBody').children.length) {
      addLine();
    }
  }

  function openReceiptModal() {
    transactionMode = 'Receipt';
    setTransactionTitle();
    document.getElementById('paymentModal').style.display = 'flex';
    setDefaultDate();
    loadDropdowns();
    if (!document.getElementById('splitBody').children.length) {
      addLine();
    }
  }

  function closePaymentModal() {
    document.getElementById('paymentModal').style.display = 'none';
  }

  function setTransactionTitle() {
    const title = transactionMode === 'Receipt' ? 'Record Receipt' : 'Record Payment';
    const titleEl = document.getElementById('transactionTitle');
    if (titleEl) titleEl.textContent = title;
  }

  function setDefaultDate() {
    document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];
  }

  function loadDropdowns() {
    setStatus('Loading master data...');
    if (!google || !google.script || !google.script.run) {
      setStatus('App runtime missing. Open via the deployed URL.');
      return;
    }

    google.script.run
      .withSuccessHandler(function(data) {
        const payload = data || {};
        paymentState.accounts = payload.accounts || [];
        paymentState.payees = payload.payees || [];
        paymentState.particulars = payload.particulars || [];
        paymentState.subCats = payload.subCats || [];
        paymentState.subToCatMap = payload.subToCatMap || {};
        paymentState.particularMeta = payload.particularMeta || {};

        fillList('accountList', paymentState.accounts);
        fillList('payeeList', paymentState.payees);
        fillList('particularList', paymentState.particulars);
        fillList('subCatList', paymentState.subCats);
        fillList('categoryList', payload.categories || []);
        fillList('financialYearList', payload.financialYears || []);
        setStatus('');
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to load master data.');
      })
      .getDropdownData();
  }

  function fillList(id, items) {
    const list = document.getElementById(id);
    list.innerHTML = '';
    (items || []).forEach(function(item) {
      const option = document.createElement('option');
      option.value = item;
      list.appendChild(option);
    });
  }

  function addLine() {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <div class="input-action">
          <input list="particularList" class="input-field particular-input" placeholder="Particulars">
          <button class="btn-icon" type="button" onclick="openAddParticularModal()">+</button>
        </div>
      </td>
      <td><input type="text" class="input-field subcat-input" readonly></td>
      <td><input type="text" class="input-field category-input" readonly></td>
      <td><input type="text" class="input-field desc-input" placeholder="Description"></td>
      <td><input type="number" class="input-field amount-input" min="0" step="0.01" placeholder="0.00"></td>
      <td><button class="btn btn-danger" type="button" onclick="removeLine(this)">Delete</button></td>
    `;

    row.querySelector('.particular-input').addEventListener('change', function() {
      const particulars = this.value.trim();
      const meta = paymentState.particularMeta[particulars] || {};
      row.querySelector('.subcat-input').value = meta.subCategory || '';
      row.querySelector('.category-input').value = meta.category || '';
    });

    row.querySelector('.amount-input').addEventListener('input', updateTotal);

    document.getElementById('splitBody').appendChild(row);
  }

  function removeLine(button) {
    const row = button.closest('tr');
    if (row) row.remove();
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    document.querySelectorAll('.amount-input').forEach(function(input) {
      const value = parseFloat(input.value);
      if (!isNaN(value)) total += value;
    });
    document.getElementById('totalAmount').textContent = total.toFixed(2);
  }

  function openAddAccountModal() {
    document.getElementById('addAccountInput').value = '';
    document.getElementById('addAccountType').value = '';
    document.getElementById('addAccountReport').value = '';
    document.getElementById('addAccountModal').classList.add('open');
    document.getElementById('addAccountInput').focus();
  }

  function openAddPayeeModal() {
    document.getElementById('addPayeeInput').value = '';
    document.getElementById('addPayeeModal').classList.add('open');
    document.getElementById('addPayeeInput').focus();
  }

  function openAddSubCategoryModal() {
    document.getElementById('addSubName').value = '';
    document.getElementById('addSubCategory').value = '';
    document.getElementById('addSubAccountType').value = '';
    document.getElementById('addSubReport').value = '';
    document.getElementById('addSubModal').classList.add('open');
    document.getElementById('addSubName').focus();
  }

  function openAddParticularModal() {
    document.getElementById('addParticularName').value = '';
    document.getElementById('addParticularSubCategory').value = '';
    document.getElementById('addParticularModal').classList.add('open');
    document.getElementById('addParticularName').focus();
  }

  function openAddFinancialYearModal() {
    document.getElementById('addFinancialYearInput').value = '';
    document.getElementById('addFinancialYearModal').classList.add('open');
    document.getElementById('addFinancialYearInput').focus();
  }

  function closeSubModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function saveNewAccount() {
    const value = document.getElementById('addAccountInput').value.trim();
    const accountType = document.getElementById('addAccountType').value.trim();
    const reportMapping = document.getElementById('addAccountReport').value.trim();
    if (!value || !accountType || !reportMapping) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving master data...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addAccountModal');
        loadDropdowns();
        setStatus('Master data saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add master data.');
        isSaving = false;
      })
      .addMasterItem('account', value, '', accountType, reportMapping);
  }

  function saveNewPayee() {
    const value = document.getElementById('addPayeeInput').value.trim();
    if (!value) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving master data...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addPayeeModal');
        loadDropdowns();
        setStatus('Master data saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add master data.');
        isSaving = false;
      })
      .addMasterItem('payee', value);
  }

  function saveNewSubCategory() {
    const name = document.getElementById('addSubName').value.trim();
    const parent = document.getElementById('addSubCategory').value.trim();
    const accountType = document.getElementById('addSubAccountType').value.trim();
    const reportMapping = document.getElementById('addSubReport').value.trim();
    if (!name || !parent || !accountType || !reportMapping) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving sub-category...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addSubModal');
        loadDropdowns();
        setStatus('Sub-category saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add sub-category.');
        isSaving = false;
      })
      .addMasterItem('subCategory', name, parent, accountType, reportMapping);
  }

  function saveNewParticular() {
    const name = document.getElementById('addParticularName').value.trim();
    const parent = document.getElementById('addParticularSubCategory').value.trim();
    if (!name || !parent) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving particulars...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addParticularModal');
        loadDropdowns();
        setStatus('Particulars saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add particulars.');
        isSaving = false;
      })
      .addMasterItem('particular', name, parent);
  }

  function saveNewFinancialYear() {
    const value = document.getElementById('addFinancialYearInput').value.trim();
    if (!value) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving financial year...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addFinancialYearModal');
        loadDropdowns();
        setStatus('Financial year saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add financial year.');
        isSaving = false;
      })
      .addMasterItem('financialYear', value);
  }

  function saveTransaction() {
    if (isSaving) return;
    const header = {
      date: document.getElementById('txnDate').value,
      financialYear: document.getElementById('txnFinancialYear').value.trim(),
      accountCode: document.getElementById('accountCode').value.trim(),
      payee: document.getElementById('payee').value.trim(),
      refNo: document.getElementById('refNo').value.trim()
    };

    const rows = [];
    document.querySelectorAll('#splitBody tr').forEach(function(row) {
      const particulars = row.querySelector('.particular-input').value.trim();
      const subCategory = row.querySelector('.subcat-input').value.trim();
      const category = row.querySelector('.category-input').value.trim();
      const description = row.querySelector('.desc-input').value.trim();
      const amount = parseFloat(row.querySelector('.amount-input').value);

      if (!particulars && !subCategory && !category && !description && isNaN(amount)) return;

      rows.push({
        particulars: particulars,
        subCategory: subCategory,
        category: category,
        description: description,
        amount: amount
      });
    });

    if (!header.date || !header.financialYear || !header.accountCode) {
      setStatus('Date, Financial Year, and Bank Account are required.');
      return;
    }

    if (!rows.length) {
      setStatus('Add at least one line.');
      return;
    }

    isSaving = true;
    const savingLabel = transactionMode === 'Receipt' ? 'Saving receipt...' : 'Saving payment...';
    setStatus(savingLabel);
    google.script.run
      .withSuccessHandler(function() {
        const savedLabel = transactionMode === 'Receipt' ? 'Receipt saved.' : 'Payment saved.';
        setStatus(savedLabel);
        resetPaymentForm();
        closePaymentModal();
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to save payment.');
        isSaving = false;
      })
      .saveTransaction({ header: header, rows: rows, type: transactionMode });
  }

  function resetPaymentForm() {
    document.getElementById('splitBody').innerHTML = '';
    document.getElementById('accountCode').value = '';
    document.getElementById('payee').value = '';
    document.getElementById('refNo').value = '';
    document.getElementById('txnFinancialYear').value = '';
    document.getElementById('totalAmount').textContent = '0.00';
    setDefaultDate();
  }

  function setStatus(message) {
    document.getElementById('statusText').textContent = message || '';
  }
</script>
<div class="submodal" id="addAccountModal">
  <div class="submodal-card">
    <div class="submodal-header">
      <span>Add Bank Account</span>
      <button class="close-btn" type="button" onclick="closeSubModal('addAccountModal')">X</button>
    </div>
    <div>
      <label class="form-label" for="addAccountInput">Account Code</label>
      <input id="addAccountInput" class="input-field" type="text" placeholder="e.g. EQUITY_MAIN">
    </div>
    <div>
      <label class="form-label" for="addAccountType">Account Type</label>
      <select id="addAccountType" class="select-field">
        <option value="">Select account type</option>
        <option value="Asset">Asset</option>
