<style>
  @keyframes modalFadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes modalSlideUp {
    from {
      opacity: 0;
      transform: translateY(40px) scale(0.96);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.75);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(10px);
  }

  .modal-overlay[style*="flex"] {
    animation: modalFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .modal-overlay[style*="flex"] .modal-content {
    animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-content {
    width: 90%;
    max-width: 720px;
    max-height: 92vh;
    background: #ffffff;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #94a3b8;
  }

  .modal-content h2 {
    background: linear-gradient(180deg, #336699 0%, #2d5a85 100%);
    color: #ffffff;
    padding: 10px 14px;
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    border-bottom: 1px solid #1e3a5f;
  }

  .modal-content > div:not(.form-header) {
    padding: 12px;
    overflow-y: auto;
  }

  .submodal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 2100;
    backdrop-filter: blur(10px);
  }

  .submodal.open {
    display: flex;
    animation: modalFadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .submodal.open .submodal-card {
    animation: modalSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .submodal-card {
    width: 90%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    padding: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid #94a3b8;
    overflow: hidden;
  }

  .submodal-card > div {
    padding: 12px;
  }

  .submodal-header {
    background: linear-gradient(180deg, #336699 0%, #2d5a85 100%);
    color: #ffffff;
    padding: 8px 12px;
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    border-bottom: 1px solid #1e3a5f;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .submodal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
  }

  .select-field {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
    background: #fef9c3;
    font-weight: 500;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .select-field:focus {
    outline: none;
    border-color: #3b82f6;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  .select-field:hover {
    border-color: #3b82f6;
    background: #fefce8;
  }

  .select-field:valid {
    background: #ffffff;
    border-color: #10b981;
  }

  .form-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    border-bottom: 1px solid #e2e8f0;
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
  }

  .close-btn {
    background: transparent;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #64748b;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .close-btn:hover {
    background: #e2e8f0;
    color: #0f172a;
    transform: scale(1.1);
  }

  .form-body {
    padding: 14px 18px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 3px;
    color: #334155;
    letter-spacing: 0;
  }

  .input-field,
  .input-field[readonly] {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 2px;
    padding: 4px 6px;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.15s ease;
    background: #fef9c3;
    font-weight: 400;
  }

  .input-field:focus {
    outline: none;
    border-color: #60a5fa;
    background: #ffffff;
    box-shadow: 0 0 0 1px #60a5fa;
  }

  .input-field:valid:not(:focus) {
    background: #ffffff;
  }

  .input-field:hover:not([readonly]) {
    border-color: #94a3b8;
  }

  .input-field[readonly] {
    background: #f1f5f9;
    color: #64748b;
    border-color: #cbd5e1;
  }

  .input-action {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
  }

  .btn-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 2px solid #e2e8f0;
    background: #ffffff;
    font-weight: 700;
    cursor: pointer;
    color: #0f172a;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn-icon:hover {
    border-color: #2563eb;
    background: #eff6ff;
    color: #2563eb;
    transform: translateY(-1px);
  }

  /* Desktop: Normal table layout */
  .split-table {
    width: 100%;
    font-size: 12px;
    border-collapse: collapse;
  }

  .split-table thead {
    background: linear-gradient(180deg, #003d82 0%, #00316b 100%);
  }

  .split-table th {
    padding: 6px 8px;
    text-align: left;
    font-weight: 700;
    font-size: 11px;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid #001f3f;
  }

  .split-table th:last-child {
    border-right: none;
  }

  .split-table tbody tr {
    border-bottom: 1px solid #e2e8f0;
    transition: background 0.15s ease;
  }

  .split-table tbody tr:nth-child(even) {
    background: #f8fafc;
  }

  .split-table tbody tr:hover {
    background: #e0f2fe;
  }

  .split-table td {
    padding: 6px 8px;
    border-right: 1px solid #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
  }

  .split-table td:last-child {
    border-right: none;
  }

  .split-table td .input-field {
    padding: 8px 10px;
    font-size: 12px;
    width: 100%;
  }

  /* Mobile: Card layout with horizontal rows */
  @media (max-width: 768px) {
    .split-table thead {
      display: none;
    }

    .split-table,
    .split-table tbody {
      display: block;
      width: 100%;
    }

    .split-table tr {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border: 1px solid #cbd5e1;
      overflow: hidden;
    }

    .split-table td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      gap: 12px;
    }

    .split-table td:last-child {
      border-bottom: none;
    }

    .split-table td:before {
      content: attr(data-label);
      font-weight: 700;
      font-size: 11px;
      color: #2563eb;
      min-width: 100px;
      flex-shrink: 0;
    }

    .split-table td .input-field,
    .split-table td input,
    .split-table td button {
      flex: 1;
      max-width: 100%;
    }
  }

  .table-actions {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: -0.01em;
    box-shadow: 0 1px 4px -1px rgba(0, 0, 0, 0.08);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.15);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.1);
  }

  .btn-primary {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.4);
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    box-shadow: 0 6px 16px -2px rgba(37, 99, 235, 0.5);
  }

  .btn-secondary {
    background: #f1f5f9;
    color: #0f172a;
    border: 2px solid #e2e8f0;
  }

  .btn-secondary:hover {
    background: #ffffff;
    border-color: #cbd5e1;
  }

  .btn-danger {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: #ffffff;
    box-shadow: 0 4px 12px -2px rgba(239, 68, 68, 0.4);
  }

  .btn-danger:hover {
    background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
    box-shadow: 0 6px 16px -2px rgba(239, 68, 68, 0.5);
  }

  .form-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-top: 1px solid #e2e8f0;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  }

  .total-amount {
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
  }

  .status-text {
    padding: 6px 0 0;
    font-size: 11px;
    color: #64748b;
    font-weight: 500;
  }

  @media (max-width: 780px) {
    .modal-content {
      width: 95%;
      max-height: 95vh;
      border-width: 1px;
    }

    .modal-content h2 {
      font-size: 12px;
      padding: 6px 10px;
    }

    .modal-content > div:not(.form-header) {
      padding: 10px;
    }

    .submodal-card {
      width: 95%;
      border-width: 1px;
    }

    .submodal-card > div {
      padding: 10px;
    }

    .submodal-header {
      font-size: 12px;
      padding: 6px 10px;
    }

    .form-label {
      font-size: 10px;
      margin-bottom: 2px;
    }

    .input-field {
      padding: 3px 5px;
      font-size: 11px;
    }

    .form-header {
      padding: 18px 20px;
      font-size: 18px;
    }

    .form-body {
      padding: 20px;
    }

    .form-footer {
      padding: 18px 20px;
    }

    .grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .total-amount {
      font-size: 20px;
    }

    .btn {
      padding: 14px 18px;
      font-size: 16px;
      min-height: 44px;
    }

    .btn-icon {
      width: 44px;
      height: 44px;
    }

    .input-field {
      padding: 13px 16px;
      font-size: 16px;
      min-height: 44px;
    }

    .select-field {
      padding: 13px 16px;
      font-size: 16px;
      min-height: 44px;
    }

    /* Mobile-specific table styles removed - using card layout globally */
  }
</style>

<div class="modal-overlay" id="paymentModal">
  <div class="modal-content">
    <div class="form-header">
      <span id="transactionTitle">Record Payment</span>
      <button class="close-btn" type="button" onclick="closePaymentModal()">X</button>
    </div>

    <div class="form-body">
      <div class="grid">
        <div>
          <label class="form-label" for="txnDate">Date</label>
          <input type="date" id="txnDate" class="input-field" required>
        </div>
        <div>
          <label class="form-label" for="txnFinancialYear">Financial Year</label>
          <div class="input-action">
            <input list="financialYearList" id="txnFinancialYear" class="input-field" placeholder="FY 2024/2025" required>
            <button class="btn-icon" type="button" onclick="openAddFinancialYearModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="accountCode">Bank Account</label>
          <div class="input-action">
            <input list="accountList" id="accountCode" class="input-field" placeholder="Select account" required>
            <button class="btn-icon" type="button" onclick="openAddAccountModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="payee">Payee</label>
          <div class="input-action">
            <input list="payeeList" id="payee" class="input-field" placeholder="Select payee">
            <button class="btn-icon" type="button" onclick="openAddPayeeModal()">+</button>
          </div>
        </div>
        <div>
          <label class="form-label" for="refNo">Ref No</label>
          <input type="text" id="refNo" class="input-field" placeholder="Cheque 001 / Mpesa Ref">
        </div>
      </div>

      <table class="split-table">
        <thead>
          <tr>
            <th>Particulars</th>
            <th>Sub-Category</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="splitBody"></tbody>
      </table>

      <div class="table-actions">
        <button class="btn btn-secondary" type="button" onclick="addLine()">Add Line</button>
      </div>

      <div class="status-text" id="statusText"></div>
    </div>

    <div class="form-footer">
      <div class="total-amount">Total: <span id="totalAmount">0.00</span></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" type="button" onclick="closePaymentModal()">Cancel</button>
        <button class="btn btn-primary" type="button" onclick="saveTransaction()">Save</button>
      </div>
    </div>
  </div>
</div>

<datalist id="accountList"></datalist>
<datalist id="payeeList"></datalist>
<datalist id="particularList"></datalist>
<datalist id="subCatList"></datalist>
<datalist id="categoryList"></datalist>
<datalist id="financialYearList"></datalist>

<script>
  const paymentState = {
    accounts: [],
    payees: [],
    particulars: [],
    subCats: [],
    subToCatMap: {},
    particularMeta: {}
  };
  let transactionMode = 'Payment';
  let allParticulars = [];
  let isSaving = false;

  function openPaymentModal() {
    transactionMode = 'Payment';
    setTransactionTitle();
    document.getElementById('paymentModal').style.display = 'flex';
    setDefaultDate();
    loadDropdowns();
    applyParticularFilter();
    if (!document.getElementById('splitBody').children.length) {
      addLine();
    }
  }

  function openReceiptModal() {
    transactionMode = 'Receipt';
    setTransactionTitle();
    document.getElementById('paymentModal').style.display = 'flex';
    setDefaultDate();
    loadDropdowns();
    applyParticularFilter();
    if (!document.getElementById('splitBody').children.length) {
      addLine();
    }
  }

  function closePaymentModal() {
    document.getElementById('paymentModal').style.display = 'none';
  }

  function setTransactionTitle() {
    const title = transactionMode === 'Receipt' ? 'Record Receipt' : 'Record Payment';
    const titleEl = document.getElementById('transactionTitle');
    if (titleEl) titleEl.textContent = title;
  }

  function setDefaultDate() {
    document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];
  }

  function loadDropdowns() {
    setStatus('Loading master data...');
    if (!google || !google.script || !google.script.run) {
      setStatus('App runtime missing. Open via the deployed URL.');
      return;
    }

    google.script.run
      .withSuccessHandler(function(data) {
        const payload = data || {};
        paymentState.accounts = payload.accounts || [];
        paymentState.payees = payload.payees || [];
        paymentState.particulars = payload.particulars || [];
        allParticulars = paymentState.particulars.slice();
        paymentState.subCats = payload.subCats || [];
        paymentState.subToCatMap = payload.subToCatMap || {};
        paymentState.particularMeta = payload.particularMeta || {};

        fillList('accountList', paymentState.accounts);
        fillList('payeeList', paymentState.payees);
        applyParticularFilter();
        fillList('subCatList', paymentState.subCats);
        fillList('categoryList', payload.categories || []);
        fillList('financialYearList', payload.financialYears || []);
        setStatus('');
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to load master data.');
      })
      .getDropdownData();
  }

  function fillList(id, items) {
    const list = document.getElementById(id);
    list.innerHTML = '';
    (items || []).forEach(function(item) {
      const option = document.createElement('option');
      option.value = item;
      list.appendChild(option);
    });
  }

  function applyParticularFilter() {
    const filtered = (allParticulars || []).filter(function(particulars) {
      const meta = paymentState.particularMeta[particulars] || {};
      if (transactionMode === 'Receipt') {
        return isOperatingIncomeParticular(meta);
      }
      if (transactionMode === 'Payment') {
        return !isIncomeMappedParticular(meta);
      }
      return true;
    });
    fillList('particularList', filtered);
  }

  function addLine() {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td data-label="Particulars">
        <div class="input-action">
          <input list="particularList" class="input-field particular-input" placeholder="Particulars">
          <button class="btn-icon" type="button" onclick="openAddParticularModal()">+</button>
        </div>
      </td>
      <td data-label="Sub-Category"><input type="text" class="input-field subcat-input" readonly></td>
      <td data-label="Category"><input type="text" class="input-field category-input" readonly></td>
      <td data-label="Description"><input type="text" class="input-field desc-input" placeholder="Description"></td>
      <td data-label="Amount"><input type="number" class="input-field amount-input" min="0" step="0.01" placeholder="0.00"></td>
      <td data-label="Action"><button class="btn btn-danger" type="button" onclick="removeLine(this)">Delete</button></td>
    `;

    row.querySelector('.particular-input').addEventListener('change', function() {
      const particulars = this.value.trim();
      const meta = paymentState.particularMeta[particulars] || {};
      if (isIncomeMappedParticular(meta) && transactionMode === 'Payment') {
        this.value = '';
        row.querySelector('.subcat-input').value = '';
        row.querySelector('.category-input').value = '';
        setStatus('Payments cannot use particulars mapped as operating income.');
        return;
      }
      if (!isOperatingIncomeParticular(meta) && transactionMode === 'Receipt') {
        this.value = '';
        row.querySelector('.subcat-input').value = '';
        row.querySelector('.category-input').value = '';
        setStatus('Receipts can only use particulars mapped as operating income.');
        return;
      }
      row.querySelector('.subcat-input').value = meta.subCategory || '';
      row.querySelector('.category-input').value = meta.category || '';
    });

    row.querySelector('.amount-input').addEventListener('input', updateTotal);

    document.getElementById('splitBody').appendChild(row);
  }

  function removeLine(button) {
    const row = button.closest('tr');
    if (row) row.remove();
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    document.querySelectorAll('.amount-input').forEach(function(input) {
      const value = parseFloat(input.value);
      if (!isNaN(value)) total += value;
    });
    document.getElementById('totalAmount').textContent = total.toFixed(2);
  }

  function openAddAccountModal() {
    document.getElementById('addAccountInput').value = '';
    document.getElementById('addAccountType').value = '';
    document.getElementById('addAccountReport').value = '';
    document.getElementById('addAccountModal').classList.add('open');
    document.getElementById('addAccountInput').focus();
  }

  function openAddPayeeModal() {
    document.getElementById('addPayeeInput').value = '';
    document.getElementById('addPayeeModal').classList.add('open');
    document.getElementById('addPayeeInput').focus();
  }

  function openAddSubCategoryModal() {
    document.getElementById('addSubName').value = '';
    document.getElementById('addSubCategory').value = '';
    document.getElementById('addSubAccountType').value = '';
    document.getElementById('addSubReport').value = '';
    document.getElementById('addSubModal').classList.add('open');
    document.getElementById('addSubName').focus();
  }

  function openAddParticularModal() {
    document.getElementById('addParticularName').value = '';
    document.getElementById('addParticularSubCategory').value = '';
    document.getElementById('addParticularCategory').value = '';
    document.getElementById('addParticularAccountType').value = '';
    document.getElementById('addParticularReport').value = '';
    document.getElementById('addParticularModal').classList.add('open');
    document.getElementById('addParticularName').focus();
  }

  function openAddFinancialYearModal() {
    document.getElementById('addFinancialYearInput').value = '';
    document.getElementById('addFinancialYearModal').classList.add('open');
    document.getElementById('addFinancialYearInput').focus();
  }

  function closeSubModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function saveNewAccount() {
    const value = document.getElementById('addAccountInput').value.trim();
    const accountType = document.getElementById('addAccountType').value.trim();
    const reportMapping = document.getElementById('addAccountReport').value.trim();
    if (!value || !accountType || !reportMapping) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving master data...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addAccountModal');
        loadDropdowns();
        setStatus('Master data saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add master data.');
        isSaving = false;
      })
      .addMasterItem('account', value, '', accountType, reportMapping);
  }

  function saveNewPayee() {
    const value = document.getElementById('addPayeeInput').value.trim();
    if (!value) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving master data...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addPayeeModal');
        loadDropdowns();
        setStatus('Master data saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add master data.');
        isSaving = false;
      })
      .addMasterItem('payee', value);
  }

  function saveNewSubCategory() {
    const name = document.getElementById('addSubName').value.trim();

    const accountType = document.getElementById('addSubAccountType').value.trim();
    const reportMapping = document.getElementById('addSubReport').value.trim();

  }

  function saveNewFinancialYear() {
    const value = document.getElementById('addFinancialYearInput').value.trim();
    if (!value) return;
    if (isSaving) return;
    isSaving = true;

    setStatus('Saving financial year...');
    google.script.run
      .withSuccessHandler(function() {
        closeSubModal('addFinancialYearModal');
        loadDropdowns();
        setStatus('Financial year saved.');
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to add financial year.');
        isSaving = false;
      })
      .addMasterItem('financialYear', value);
  }

  function saveTransaction() {
    if (isSaving) return;
    const header = {
      date: document.getElementById('txnDate').value,
      financialYear: document.getElementById('txnFinancialYear').value.trim(),
      accountCode: document.getElementById('accountCode').value.trim(),
      payee: document.getElementById('payee').value.trim(),
      refNo: document.getElementById('refNo').value.trim()
    };

    const rows = [];
    let hasInvalid = false;
    document.querySelectorAll('#splitBody tr').forEach(function(row) {
      const particulars = row.querySelector('.particular-input').value.trim();
      const subCategory = row.querySelector('.subcat-input').value.trim();
      const category = row.querySelector('.category-input').value.trim();
      const description = row.querySelector('.desc-input').value.trim();
      const amount = parseFloat(row.querySelector('.amount-input').value);

      if (!particulars && !subCategory && !category && !description && isNaN(amount)) return;

      const meta = paymentState.particularMeta[particulars] || {};
      if (isIncomeMappedParticular(meta) && transactionMode === 'Payment') {
        setStatus('Payments cannot use particulars mapped as operating income.');
        hasInvalid = true;
        return;
      }
      if (!isOperatingIncomeParticular(meta) && transactionMode === 'Receipt') {
        setStatus('Receipts can only use particulars mapped as operating income.');
        hasInvalid = true;
        return;
      }

      rows.push({
        particulars: particulars,
        subCategory: subCategory,
        category: category,
        description: description,
        amount: amount
      });
    });

    if (!header.date || !header.financialYear || !header.accountCode) {
      setStatus('Date, Financial Year, and Bank Account are required.');
      return;
    }

    if (hasInvalid) {
      return;
    }

    if (!rows.length) {
      setStatus('Add at least one line.');
      return;
    }

    isSaving = true;
    const savingLabel = transactionMode === 'Receipt' ? 'Saving receipt...' : 'Saving payment...';
    setStatus(savingLabel);
    google.script.run
      .withSuccessHandler(function() {
        const savedLabel = transactionMode === 'Receipt' ? 'Receipt saved.' : 'Payment saved.';
        setStatus(savedLabel);
        resetPaymentForm();
        closePaymentModal();
        isSaving = false;
      })
      .withFailureHandler(function(error) {
        setStatus(error.message || 'Failed to save payment.');
        isSaving = false;
      })
      .saveTransaction({ header: header, rows: rows, type: transactionMode });
  }

  function resetPaymentForm() {
    document.getElementById('splitBody').innerHTML = '';
    document.getElementById('accountCode').value = '';
    document.getElementById('payee').value = '';
    document.getElementById('refNo').value = '';
    document.getElementById('txnFinancialYear').value = '';
    document.getElementById('totalAmount').textContent = '0.00';
    setDefaultDate();
  }

  function setStatus(message) {
    document.getElementById('statusText').textContent = message || '';
  }

  function isIncomeMappedParticular(meta) {
    const accountType = String(meta.accountType || '').toLowerCase();
    const reportMapping = String(meta.reportMapping || '').toLowerCase();
    if (accountType.includes('income')) return true;
    if (reportMapping.includes('operating income')) return true;
    if (reportMapping === 'income' || reportMapping.includes('income')) return true;
    return false;
  }

  function isOperatingIncomeParticular(meta) {
    const reportMapping = String(meta.reportMapping || '').toLowerCase();
    return reportMapping.includes('operating income');
  }
</script>
