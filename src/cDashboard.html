    function formatAmount(value) {
      const amount = Number(value || 0);
      if (!Number.isFinite(amount)) return '';
      return amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function downloadBase64File(base64, filename, mimeType) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const blob = new Blob([bytes], { type: mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function bindResultActions() {

        if (editBtn) {

          const rowId = Number(editBtn.dataset.rowId);
          if (!rowId) {
            showAlert('Invalid transaction row.', 'error');
            return;

          loadJournalRow(rowId);
          return;
        }

        const reverseBtn = event.target.closest('.reverse-transaction-btn');
        if (reverseBtn) {
          const batchId = String(reverseBtn.dataset.batchId || '').trim();
          if (batchId) {
            confirmReverseBatch(batchId);
            return;

          const rowId = Number(reverseBtn.dataset.rowId);
          if (!rowId) {
            showAlert('Invalid transaction row.', 'error');
            return;
          }
          confirmReverseRow(rowId);
        }
      };

    function groupSearchResults(results) {
      const groups = {};
      results.forEach(item => {
        const key = String(item.batchId || '').trim() || String(item.rowId || '').trim();
        if (!key) return;
        if (!groups[key]) {
          groups[key] = { batchId: item.batchId || '', items: [], rowIds: [], totalDebit: 0, totalCredit: 0 };
        }
        const debit = Number(item.debit || 0) || 0;
        const credit = Number(item.credit || 0) || 0;
        groups[key].items.push(item);
        groups[key].rowIds.push(item.rowId);
        groups[key].totalDebit += debit;
        groups[key].totalCredit += credit;
      });

      return Object.values(groups).map(group => {
        const items = group.items;
        const preferred = items.find(entry => !String(entry.accountCode || '').trim()) || items[0] || {};
        const refNo = items.find(entry => String(entry.refNo || '').trim()) || preferred;
        const bankRef = items.find(entry => String(entry.bankRef || '').trim()) || preferred;
        return Object.assign({}, preferred, {
          batchId: group.batchId || preferred.batchId || '',
          rowId: preferred.rowId,
          refNo: refNo ? refNo.refNo : '',
          bankRef: bankRef ? bankRef.bankRef : '',
          totalDebit: formatAmount(group.totalDebit),
          totalCredit: formatAmount(group.totalCredit),
          lineCount: items.length
        });
      }).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    }

      select.innerHTML = rows.map((row, index) => {

    function setEditBatchSummary(rows) {
      if (!rows || !rows.length) return;
      const typeField = document.getElementById('editTransactionType');
      const totalsField = document.getElementById('editBatchTotals');
      const totals = rows.reduce((acc, item) => {
        acc.debit += Number(item.debit || 0) || 0;
        acc.credit += Number(item.credit || 0) || 0;
        return acc;
      }, { debit: 0, credit: 0 });
      if (typeField) typeField.value = resolveTransactionType(rows);
      if (totalsField) totalsField.value = `Dr ${formatAmount(totals.debit)} / Cr ${formatAmount(totals.credit)}`;
      setReverseButtonsState(rows);
    }

    function resolveTransactionType(rows) {
      const firstBatch = String(rows[0]?.batchId || '').trim();
      if (firstBatch.startsWith('JRN-')) return 'Journal Entry';
      const bankRow = rows.find(item => String(item.accountCode || '').trim());
      if (!bankRow) return 'Journal Entry';
      const debit = Number(bankRow.debit || 0) || 0;
      const credit = Number(bankRow.credit || 0) || 0;
      if (debit > 0 && credit === 0) return 'Receipt';
      if (credit > 0 && debit === 0) return 'Payment';
      return 'Transaction';
    }

    function saveUser(event) {
      event.preventDefault();

      const form = document.getElementById('userForm');
      const rowId = form.dataset.rowId;
      const pinValue = document.getElementById('userPin').value.trim();
      const payload = {
        rowId: rowId ? Number(rowId) : null,
        email: document.getElementById('userEmail').value.trim(),
        pin: pinValue,
        name: document.getElementById('userNameInput').value.trim(),
        role: document.getElementById('userRoleInput').value,
        status: document.getElementById('userStatusInput').value
      };

      if (!payload.rowId && !/^\d{4}$/.test(pinValue)) {
        alert('PIN must be exactly 4 digits.');
        return;
      }

      if (payload.rowId && pinValue && !/^\d{4}$/.test(pinValue)) {
        alert('PIN must be exactly 4 digits.');
        return;
      }

      const action = payload.rowId ? 'updateUser' : 'addUser';

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showAlert('App runtime missing.', 'error');
        return;
      }

      showAlert('Saving user...', 'info');
      google.script.run
        .withSuccessHandler(function() {

        .withFailureHandler(function(error) {

    function startSessionMonitoring() {
      const TIMEOUT_MS = 5 * 60 * 1000;
      const WARNING_MS = 60 * 1000;

      function resetActivity() {
        lastActivity = Date.now();
      }

      ['mousedown', 'keydown', 'scroll', 'touchstart'].forEach(eventName => {
        document.addEventListener(eventName, resetActivity, true);
      });

      sessionCheckInterval = setInterval(function() {
        const now = Date.now();
        const inactiveTime = now - lastActivity;
        const timeRemaining = TIMEOUT_MS - inactiveTime;

        if (timeRemaining <= 0) {
          clearInterval(sessionCheckInterval);
          clearInterval(countdownInterval);

          google.script.run
            .withSuccessHandler(function() {
              window.location.href = window.location.origin + window.location.pathname + '?expired=true';
            })
            .logout();
        } else if (timeRemaining <= WARNING_MS) {
          document.getElementById('sessionTimer').classList.add('warning');
        } else {
          document.getElementById('sessionTimer').classList.remove('warning');
          document.getElementById('timeRemaining').textContent = 'Session active';
        }
      }, 10000);

      countdownInterval = setInterval(function() {
        const now = Date.now();
        const inactiveTime = now - lastActivity;
        const timeRemaining = TIMEOUT_MS - inactiveTime;

        if (timeRemaining <= WARNING_MS && timeRemaining > 0) {
          const seconds = Math.floor(timeRemaining / 1000);
          const minutes = Math.floor(seconds / 60);
          const secs = seconds % 60;
          document.getElementById('timeRemaining').textContent =
            `Expires in ${minutes}:${secs.toString().padStart(2, '0')}`;
        }
      }, 1000);
    }

          </div>
          <div id="approvalsTableContainer" style="margin-top:16px;">
            <p>Loading pending approvals...</p>
          </div>
        </div>
      `;
      loadPendingApprovals();
    }

    function loadPendingApprovals() {
      const container = document.getElementById('approvalsTableContainer');
      container.innerHTML = '<p>Loading pending approvals...</p>';

      google.script.run
        .withSuccessHandler(function(orders) {
          const pending = (orders || []).filter(po => po.Status === 'Draft');

          if (pending.length === 0) {
            container.innerHTML = '<p style="color:#6b7280;">No purchase orders pending approval.</p>';
            return;
          }

          let html = `
            <table class="table">
              <thead>
                <tr>
                  <th>PO Number</th>
                  <th>Date</th>
                  <th>Supplier</th>
                  <th>Description</th>
                  <th>Amount</th>
                  <th>Requested By</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
          `;

          pending.forEach(po => {
            const amount = parseFloat(po.Total_Amount) || 0;
            html += `
              <tr>
                <td><strong>${po.PO_Number || ''}</strong></td>
                <td>${po.PO_Date || ''}</td>
                <td>${po.Supplier_Name || '-'}</td>
                <td>${po.Description || '-'}</td>
                <td style="text-align:right;">${amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td>${po.Requested_By || '-'}</td>
                <td>
                  <button class="btn btn-primary" style="padding:4px 8px;font-size:11px;" onclick="approvePO('${po.PO_ID}', '${po.PO_Number}')">Approve</button>
                </td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          container.innerHTML = html;
        })
        .withFailureHandler(function(error) {
          container.innerHTML = '<p style="color:#dc2626;">Failed to load approvals: ' + error.message + '</p>';
        })
        .getPurchaseOrders();
    }

    function approvePO(poId, poNumber) {
      if (!confirm('Approve PO ' + poNumber + '?')) return;

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            alert('PO ' + poNumber + ' approved successfully.');
            loadPendingApprovals();
          } else {
            alert('Failed to approve: ' + (result.message || 'Unknown error'));
          }
        })
        .withFailureHandler(function(error) {
          alert('Error: ' + error.message);
        })
        .approvePurchaseOrder(poId);
    }
  </script>
