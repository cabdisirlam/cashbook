<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial System - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
    }

    .sidebar-header {
      padding: 18px 20px;
      font-weight: 700;
      font-size: 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    .menu-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .main-content {
      flex: 1;
      margin-left: 240px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: #ffffff;
      padding: 16px 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-weight: 600;
      color: #0f172a;
      font-size: 14px;
    }

    .user-role {
      font-size: 12px;
      color: #64748b;
    }

    .logout-btn {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .content-area {
      flex: 1;
      padding: 24px;
    }

    .skeleton-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    .skeleton-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .skeleton-card p {
      font-size: 14px;
      color: #64748b;
    }

    .session-timer {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.92);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
    }

    .session-timer.warning {
      background: rgba(239, 68, 68, 0.92);
    }

    @media (max-width: 768px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">Financial System</div>
    <div class="menu-container" id="menuContainer">
      <?!= include('dMenu'); ?>
    </div>
  </div>

  <div class="main-content">
    <div class="header">
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-name" id="userName">Loading...</div>
          <div class="user-role" id="userRole">Loading...</div>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="skeleton-card">
        <h2>Dashboard</h2>
        <p>This is the skeleton dashboard. Use the menu to navigate.</p>
      </div>
    </div>
  </div>

  <div class="session-timer" id="sessionTimer">
    <span id="timeRemaining">Session active</span>
  </div>

  <script>
    let sessionCheckInterval;
    let countdownInterval;
    let lastActivity = Date.now();

    window.onload = function() {
      loadUserInfo();
      startSessionMonitoring();
    };

    function loadUserInfo() {
      google.script.run
        .withSuccessHandler(function(user) {
          if (!user.authenticated) {
            if (user.expired) {
              window.location.href = window.location.origin + window.location.pathname + '?expired=true';
            } else {
              window.location.reload();
            }
            return;
          }

          document.getElementById('userName').textContent = user.name;
          document.getElementById('userRole').textContent = user.role;
          initializeMenuForRole(user.role);
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load user info:', error);
          alert('Failed to load user information. Please refresh the page.');
        })
        .getCurrentUser();
    }

    function initializeMenuForRole(role) {
      filterMenuByRole(role);
      renderContent('Dashboard');
      setActiveMenu('Dashboard');
    }

    function filterMenuByRole(role) {
      const menuItems = document.querySelectorAll('[data-role]');
      const roleLower = role.toLowerCase();

      menuItems.forEach(item => {
        const allowedRoles = item.getAttribute('data-role').split(',').map(r => r.trim());
        item.style.display = allowedRoles.includes(roleLower) ? 'flex' : 'none';
      });
    }

    function setActiveMenu(label) {
      document.querySelectorAll('.menu-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.label === label) {
          item.classList.add('active');
        }
      });
    }

    function navigateTo(element, label) {
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
      renderContent(label);
    }

    function renderContent(label) {
      const contentArea = document.getElementById('contentArea');
      const pageTitle = document.getElementById('pageTitle');

      pageTitle.textContent = label;
      contentArea.innerHTML = `
        <div class="skeleton-card">
          <h2>${label}</h2>
          <p>Skeleton view for ${label}. Content will be added later.</p>
        </div>
      `;
    }

    function handleLogout() {
      if (confirm('Are you sure you want to logout?')) {
        google.script.run
          .withSuccessHandler(function() {
            window.location.reload();
          })
          .withFailureHandler(function(error) {
            console.error('Logout error:', error);
            window.location.reload();
          })
          .logout();
      }
    }

    function startSessionMonitoring() {
      const TIMEOUT_MS = 5 * 60 * 1000;
      const WARNING_MS = 60 * 1000;

      function resetActivity() {
        lastActivity = Date.now();
      }

      ['mousedown', 'keydown', 'scroll', 'touchstart'].forEach(eventName => {
        document.addEventListener(eventName, resetActivity, true);
      });

      sessionCheckInterval = setInterval(function() {
        const now = Date.now();
        const inactiveTime = now - lastActivity;
        const timeRemaining = TIMEOUT_MS - inactiveTime;

        if (timeRemaining <= 0) {
          clearInterval(sessionCheckInterval);
          clearInterval(countdownInterval);

          google.script.run
            .withSuccessHandler(function() {
              window.location.href = window.location.origin + window.location.pathname + '?expired=true';
            })
            .logout();
        } else if (timeRemaining <= WARNING_MS) {
          document.getElementById('sessionTimer').classList.add('warning');
        } else {
          document.getElementById('sessionTimer').classList.remove('warning');
          document.getElementById('timeRemaining').textContent = 'Session active';
        }
      }, 10000);

      countdownInterval = setInterval(function() {
        const now = Date.now();
        const inactiveTime = now - lastActivity;
        const timeRemaining = TIMEOUT_MS - inactiveTime;

        if (timeRemaining <= WARNING_MS && timeRemaining > 0) {
          const seconds = Math.floor(timeRemaining / 1000);
          const minutes = Math.floor(seconds / 60);
          const secs = seconds % 60;
          document.getElementById('timeRemaining').textContent =
            `Expires in ${minutes}:${secs.toString().padStart(2, '0')}`;
        }
      }, 1000);
    }
  </script>
</body>
</html>
