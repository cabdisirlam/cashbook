    function renderPerformanceReport(result) {
      const container = document.getElementById('performanceReport');
      if (!container) return;

      const revenueRows = (result.revenue && result.revenue.rows) ? result.revenue.rows : [];
      const expenseRows = (result.expenses && result.expenses.rows) ? result.expenses.rows : [];
      const otherRows = (result.other && result.other.rows) ? result.other.rows : [];

      if (!revenueRows.length && !expenseRows.length && !otherRows.length) {
        container.innerHTML = '<div class="card"><p>No performance data found for the selected years.</p></div>';
        return;
      }

      const currentLabel = result.currentYear ? `Current FY (${result.currentYear})` : 'Current FY';
      const comparativeLabel = result.comparativeYear ? `Comparative FY (${result.comparativeYear})` : 'Comparative FY';
      const titleYear = result.currentYear || '';
      const yearEndLabel = getFinancialYearEndLabel(titleYear);

      let rows = '';

      if (revenueRows.length) {
        rows += `
          <tr>
            <td style="font-weight:700;">Revenue</td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        `;
        revenueRows.forEach(row => {
          rows += `
            <tr>
              <td>${row.description || ''}</td>
              <td>${row.note || ''}</td>
              <td>${formatPerformanceAmount(row.currentAmount)}</td>
              <td>${formatPerformanceAmount(row.comparativeAmount)}</td>
            </tr>
          `;
        });
        rows += `
          <tr>
            <td><strong>Total Revenue</strong></td>
            <td></td>
            <td><strong>${formatPerformanceAmount(result.revenue.totalCurrent)}</strong></td>
            <td><strong>${formatPerformanceAmount(result.revenue.totalComparative)}</strong></td>
          </tr>
        `;
      }

      if (expenseRows.length) {
        rows += `
          <tr>
            <td style="font-weight:700;">Expenses</td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        `;
        expenseRows.forEach(row => {
          rows += `
            <tr>
              <td>${row.description || ''}</td>
              <td>${row.note || ''}</td>
              <td>${formatPerformanceAmount(row.currentAmount)}</td>
              <td>${formatPerformanceAmount(row.comparativeAmount)}</td>
            </tr>
          `;
        });
        rows += `
          <tr>
            <td><strong>Total Expenses</strong></td>
            <td></td>
            <td><strong>${formatPerformanceAmount(result.expenses.totalCurrent)}</strong></td>
            <td><strong>${formatPerformanceAmount(result.expenses.totalComparative)}</strong></td>

      if (otherRows.length) {

            <td style="font-weight:700;">Other gains/(losses)</td>

            <td></td>

      const previousEndLabel = previousRange.endYear ? `As at June 30, ${previousRange.endYear}` : `As at June 30 (${previousYear || 'Previous FY'})`;
      const currentStartLabel = currentRange.startYear ? `As at July 1, ${currentRange.startYear}` : `As at July 1 (${titleYear || 'Current FY'})`;

          <tbody>${body}${totalRow}</tbody>
        </table>
      `;
    }

    function formatPerformanceAmount(value) {
      const amount = Number(value || 0);
      if (!Number.isFinite(amount)) return '';
      const formatted = Math.abs(amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return amount < 0 ? '(' + formatted + ')' : formatted;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsString(value) {
      return String(value || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r/g, '\\r')
        .replace(/\n/g, '\\n');
    }

    function getFinancialYearRange(label) {
      const text = String(label || '').trim();
      if (!text) return { startYear: null, endYear: null };

      const rangeMatch = text.match(/(\d{4})\s*[\/-]\s*(\d{2,4})/);
      if (rangeMatch) {
        const start = parseInt(rangeMatch[1], 10);
        const endRaw = rangeMatch[2];
        const end = endRaw.length === 2 ? parseInt(String(start).slice(0, 2) + endRaw, 10) : parseInt(endRaw, 10);
        return { startYear: Number.isFinite(start) ? start : null, endYear: Number.isFinite(end) ? end : null };
      }

      const yearMatches = text.match(/\d{4}/g) || [];
      if (yearMatches.length >= 2) {
        const start = parseInt(yearMatches[0], 10);
        const end = parseInt(yearMatches[1], 10);
        return { startYear: Number.isFinite(start) ? start : null, endYear: Number.isFinite(end) ? end : null };
      }

      if (yearMatches.length === 1) {
        const end = parseInt(yearMatches[0], 10);
        const start = end - 1;
        return { startYear: Number.isFinite(start) ? start : null, endYear: Number.isFinite(end) ? end : null };
      }

      return { startYear: null, endYear: null };
    }

    function getFinancialYearEndLabel(label) {
      const range = getFinancialYearRange(label);
      if (range.endYear) {
        return `30 June ${range.endYear}`;
      }
      return label || '';
    }

    function fetchStatementDetails(kind, payee, contactId, callback) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showAlert('App runtime missing. Open the web app via the deployed URL.', 'error');
        return;
      }
      const financialYear = getStatementYear(kind);
      const dateRange = getStatementDateRange(kind);
      const requestKind = resolveStatementKind(kind);
      google.script.run
        .withSuccessHandler(function(result) {
          if (typeof callback === 'function') callback(result);
        })
        .withFailureHandler(function(error) {
          showAlert(error.message || 'Failed to load statement details.', 'error');
        })
        .getReceivablePayableStatement(requestKind, payee, { financialYear: financialYear, startDate: dateRange.startDate, endDate: dateRange.endDate, contactId: contactId || '' });
    }

      }

        };

      return kind === 'staff' ? 'receivable' : kind;

    function getStatementAmounts(kind, row) {
      const normalized = resolveStatementKind(kind);
      const amount = normalized === 'payable' ? row.credit : row.debit;
      const payment = normalized === 'payable' ? row.debit : row.credit;
      return { amount: amount, payment: payment };
    }

    function downloadRowsAsCsv(rows, filename) {
      if (!rows || !rows.length) return;
      const csv = rows.map(row => row.map(escapeCsv).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename || 'report.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function downloadRowsAsXlsx(rows, filename, sheetName) {
      if (typeof XLSX === 'undefined') {
        return false;
      }
      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, sheetName || 'Report');
      XLSX.writeFile(workbook, filename || 'report.xlsx');
      return true;
    }

      const titleYear = changes.titleYear || result.currentYear || '';
      const previousYear = changes.previousYear || result.comparativeYear || '';
      const prev = changes.previous || {};
      const curr = changes.current || {};
      const yearEndLabel = getFinancialYearEndLabel(titleYear);

      const previousRange = getFinancialYearRange(previousYear);
      const currentRange = getFinancialYearRange(titleYear);
      const previousStartLabel = previousRange.startYear ? `As at July 1, ${previousRange.startYear}` : `As at July 1 (${previousYear || 'Previous FY'})`;
      const previousEndLabel = previousRange.endYear ? `As at June 30, ${previousRange.endYear}` : `As at June 30 (${previousYear || 'Previous FY'})`;

      rows.push(['Description', 'Revaluation Reserve', 'Accumulated Fund', 'Total']);
      rows.push(['', 'Kshs', 'Kshs', 'Kshs']);

      const pushChangeRow = (label, rev, acc) => {
        rows.push([label, formatPerformanceAmount(rev), formatPerformanceAmount(acc), formatPerformanceAmount((rev || 0) + (acc || 0))]);
      };

      pushChangeRow(previousStartLabel, prev.openingRevaluation || 0, prev.openingAccumulated || 0);
      pushChangeRow('Revaluation gain', prev.revaluationGain || 0, 0);
      pushChangeRow('Transfer of excess depreciation on revaluation', prev.transfer || 0, prev.transfer || 0);
      pushChangeRow('Other changes during the year', prev.otherChangesRevaluation || 0, prev.otherChangesAccumulated || 0);
      pushChangeRow('Surplus/(deficit) for the year', 0, prev.surplus || 0);
      pushChangeRow(previousEndLabel, prev.closingRevaluation || 0, prev.closingAccumulated || 0);

      pushChangeRow(currentStartLabel, curr.openingRevaluation || 0, curr.openingAccumulated || 0);
      pushChangeRow('Revaluation gain', curr.revaluationGain || 0, 0);
      pushChangeRow('Transfer of excess depreciation on revaluation', curr.transfer || 0, curr.transfer || 0);
      pushChangeRow('Other changes during the year', curr.otherChangesRevaluation || 0, curr.otherChangesAccumulated || 0);
      pushChangeRow('Surplus/(deficit) for the year', 0, curr.surplus || 0);
      pushChangeRow(currentEndLabel, curr.closingRevaluation || 0, curr.closingAccumulated || 0);

      return rows;
    }

    function setComparativeFromCurrent(currentId, comparativeId) {
      const currentSelect = document.getElementById(currentId);
      const comparativeSelect = document.getElementById(comparativeId);
      if (!currentSelect || !comparativeSelect) return;

      const values = Array.from(currentSelect.options).map(option => option.value).filter(Boolean);
      if (!values.length) return;
      const currentValue = currentSelect.value;
      const index = values.indexOf(currentValue);
      if (index > 0) {
        comparativeSelect.value = values[index - 1];
      } else {
        comparativeSelect.value = currentValue || values[0];
      }
    }

    function bindComparativeSync(currentId, comparativeId) {
      const currentSelect = document.getElementById(currentId);
      if (!currentSelect) return;
      currentSelect.onchange = function() {
        setComparativeFromCurrent(currentId, comparativeId);
      };
    }

    function renderNotesReport(result) {
      const container = document.getElementById('notesReport');
      if (!container) return;

      const performanceCategories = (result && result.performanceCategories) ? result.performanceCategories : (result && result.categories) ? result.categories : [];
      const cashCategories = (result && result.cashCategories) ? result.cashCategories : [];
      if (!performanceCategories.length && !cashCategories.length) {
        container.innerHTML = '<div class="card"><p>No notes found for the selected years.</p></div>';
        return;
      }

      const currentLabel = result.currentYear ? `Current FY (${result.currentYear})` : 'Current FY';
      const comparativeLabel = result.comparativeYear ? `Comparative FY (${result.comparativeYear})` : 'Comparative FY';

      const renderNotesSection = function(title, categories) {
        if (!categories.length) return '';
        const sectionHtml = categories.map(function(category, index) {
          const noteNumber = category.noteNumber || (index + 6);
          const subRows = (category.subCategories || []).map(function(subCategory) {
            const items = (subCategory.items || []).map(function(item) {
              return `
              <tr>
                <td>${item.particulars || ''}</td>
                <td>${formatAmount(item.currentAmount)}</td>
                <td>${formatAmount(item.comparativeAmount)}</td>
              </tr>
            `;
            }).join('');

            return `
            <tr>
              <td colspan="3" style="font-weight:600;background:#f9fafb;">${subCategory.subCategory || ''}</td>
            </tr>
            ${items}
          `;
          }).join('');

          return `
          <div class="card" style="margin-bottom:16px;">
            <div style="font-weight:700;margin-bottom:8px;">${noteNumber}. ${category.category || ''}</div>
            <table class="table">
              <thead>
                <tr>
                  <th rowspan="2" style="width:50%;">Description</th>
                  <th>${currentLabel}</th>
                  <th>${comparativeLabel}</th>
                </tr>
                <tr>
                  <th>Kshs</th>
                  <th>Kshs</th>
                </tr>
              </thead>
              <tbody>
                ${subRows}
                <tr>
                  <td><strong>Total</strong></td>
                  <td><strong>${formatAmount(category.totalCurrent)}</strong></td>
                  <td><strong>${formatAmount(category.totalComparative)}</strong></td>
                </tr>
              </tbody>
            </table>
          </div>
        `;
        }).join('');

        return `
        <div class="card" style="margin-bottom:16px;">
          <div style="font-weight:700;margin-bottom:8px;">${title}</div>
        </div>
        ${sectionHtml}
      `;
      };

      const notesHtml = [
        renderNotesSection('Performance Notes', performanceCategories),
        renderNotesSection('Cash Flow Notes', cashCategories)
      ].filter(Boolean).join('');

      container.innerHTML = notesHtml;
    }

    function saveOriginalBudget() {
      const financialYear = document.getElementById('bulkFinancialYear').value.trim();
      const budgetDate = document.getElementById('bulkBudgetDate').value;
      if (!financialYear) {
        showBudgetAlert('Financial year is required.', 'error');
        return;
      }
      if (!isAdminUser() && budgetOriginalYears.includes(financialYear)) {
        showBudgetAlert('Original budget already exists for ' + financialYear + '. Choose another year or contact admin.', 'error');
        return;
      }
      if (!budgetDate) {
        showBudgetAlert('Budget date is required.', 'error');
        return;
      }

      if (!budgetCatalog.length) {
        showBudgetAlert('No categories available to save.', 'error');
        return;
      }

      const rows = [];
      for (let i = 0; i < budgetCatalog.length; i++) {
        const input = document.getElementById(`bulkAmount_${i}`);
        const value = input ? input.value.trim() : '';
        const amount = value === '' ? 0 : Number(value);
        if (!Number.isFinite(amount)) {
          showBudgetAlert('Invalid amount for ' + budgetCatalog[i].category + '.', 'error');
          return;
        }
        if (amount < 0) {
          showBudgetAlert('Original budget must be positive for ' + budgetCatalog[i].category + '.', 'error');
          return;
        }
        rows.push({
          category: budgetCatalog[i].category,
          accountType: budgetCatalog[i].accountType,
          amount: amount
        });
      }

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showBudgetAlert('App runtime missing. Open the web app via the deployed URL.', 'error');
        return;
      }

      showBudgetAlert('Saving original budget...', 'info');
      google.script.run
        .withSuccessHandler(function(result) {
          closeBudgetBulkModal();
          if (financialYear && !budgetOriginalYears.includes(financialYear)) {
            budgetOriginalYears.push(financialYear);
            budgetOriginalYears.sort();
          }
          showBudgetAlert('Original budget saved (' + (result ? result.count : 0) + ' rows).', 'success');
        })
        .withFailureHandler(function(error) {
          showBudgetAlert(error.message || 'Failed to save original budget.', 'error');
        })
        .saveOriginalBudget({ financialYear: financialYear, date: budgetDate, rows: rows });
    }

    // ============================================================

    var masterDataCache = null;

    function loadMasterDataForCascade(callback) {
      if (masterDataCache) {
        callback(masterDataCache);
        return;
      }
      google.script.run
        .withSuccessHandler(function(data) {
          masterDataCache = data || {};
          callback(masterDataCache);
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load master data:', error);
          callback({});
        })
        .getDropdownData();
    }

    function normalizeCategoryKey(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    function initCascadingDropdowns(prefix, options) {
      // prefix: unique identifier for this form (e.g., 'invoice', 'payment', 'journal')
      // options: { onParticularSelect: function(meta), accountType: 'Income', allowedCategories: [] }
      loadMasterDataForCascade(function(data) {
        const categories = data.categories || [];
        const subCats = data.subCats || [];
        const particulars = data.particulars || [];
        const subToCatMap = data.subToCatMap || {};
        const particularMeta = data.particularMeta || {};
        const targetAccountType = options && options.accountType ? String(options.accountType) : '';
        const allowedCategoryFilters = options && Array.isArray(options.allowedCategories) ? options.allowedCategories : null;
        const allowedCategoryKeys = allowedCategoryFilters
          ? new Set(allowedCategoryFilters.map(normalizeCategoryKey))
          : null;

        let filteredParticulars = particulars;
        if (targetAccountType) {
          const target = targetAccountType.toLowerCase();
          filteredParticulars = particulars.filter(p => {
            const meta = particularMeta[p] || {};
            const accountType = String(meta.accountType || '').toLowerCase();
            return accountType === target;
          });
        }
        if (allowedCategoryKeys) {
          filteredParticulars = filteredParticulars.filter(p => {
            const meta = particularMeta[p] || {};
            const categoryKey = normalizeCategoryKey(meta.category || '');
            return categoryKey && allowedCategoryKeys.has(categoryKey);
          });
        }

        const allowedSubCats = new Set();
        const allowedCategorySet = new Set();
        filteredParticulars.forEach(p => {
          const meta = particularMeta[p] || {};
          if (meta.subCategory) allowedSubCats.add(meta.subCategory);
          if (meta.category) allowedCategorySet.add(meta.category);
        });
        const filteredSubCats = subCats.filter(sc => allowedSubCats.has(sc));
        const filteredCategories = categories.filter(cat => allowedCategorySet.has(cat));

        // Store data for this prefix
        window[prefix + 'CascadeData'] = {
          categories: targetAccountType ? filteredCategories : categories,
          subCats: targetAccountType ? filteredSubCats : subCats,
          particulars: filteredParticulars,
          subToCatMap: subToCatMap,
          particularMeta: particularMeta
        };

        // Populate Category dropdown
        const catSelect = document.getElementById(prefix + 'Category');
        if (catSelect) {
          catSelect.innerHTML = '<option value="">-- Select Category --</option>';
          const catList = targetAccountType ? filteredCategories : categories;
          const visibleCategories = allowedCategoryKeys
            ? catList.filter(cat => allowedCategoryKeys.has(normalizeCategoryKey(cat)))
            : catList;
          visibleCategories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            catSelect.appendChild(opt);
          });
        }

        // Initialize empty Sub-Category and Particulars
        const subCatSelect = document.getElementById(prefix + 'SubCategory');
        if (subCatSelect) {
          subCatSelect.innerHTML = '<option value="">-- Select Category first --</option>';
        }

        const partSelect = document.getElementById(prefix + 'Particulars');
        if (partSelect) {
          partSelect.innerHTML = '<option value="">-- Select Sub-Category first --</option>';
        }
      });
    }

    function onCategoryChange(prefix) {
      const data = window[prefix + 'CascadeData'] || {};
      const selectedCat = document.getElementById(prefix + 'Category').value;
      const subCatSelect = document.getElementById(prefix + 'SubCategory');
      const partSelect = document.getElementById(prefix + 'Particulars');

      // Filter sub-categories by selected category
      const filteredSubCats = data.subCats.filter(sc => data.subToCatMap[sc] === selectedCat);

      subCatSelect.innerHTML = '<option value="">-- Select Sub-Category --</option>';
      filteredSubCats.forEach(sc => {
        const opt = document.createElement('option');
        opt.value = sc;
        opt.textContent = sc;
        subCatSelect.appendChild(opt);
      });

      // Reset particulars
      partSelect.innerHTML = '<option value="">-- Select Sub-Category first --</option>';
    }

    function onSubCategoryChange(prefix) {
      const data = window[prefix + 'CascadeData'] || {};
      const selectedSubCat = document.getElementById(prefix + 'SubCategory').value;
      const partSelect = document.getElementById(prefix + 'Particulars');

      // Filter particulars by selected sub-category
      const filteredParts = data.particulars.filter(p => {

      filteredParts.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        partSelect.appendChild(opt);
      });
    }

          }

          // Populate Payment Terms dropdown
          if (config.termsSelect && config.termsOptions) {

    function saveBudgetAdjustment() {
      const date = document.getElementById('adjustDate').value;
      const financialYear = document.getElementById('adjustFinancialYear').value.trim();
      const type = document.getElementById('adjustmentType').value;
      const amountValue = document.getElementById('adjustAmount').value.trim();
      const amount = Number(amountValue);
      const authRef = document.getElementById('adjustAuthRef').value.trim();
      const description = document.getElementById('adjustDescription').value.trim();

      if (!financialYear) {
        showBudgetAlert('Financial year is required.', 'error');
        return;
      }
      if (!amountValue || !Number.isFinite(amount) || amount === 0) {
        showBudgetAlert('Amount must be non-zero.', 'error');
        return;
      }
      if (!authRef) {
        showBudgetAlert('Auth reference is required.', 'error');
        return;
      }
      if (!description) {
        showBudgetAlert('Description is required.', 'error');
        return;
      }

      const payload = {
        date: date,
        financialYear: financialYear,
        type: type,
        amount: amount,
        authRef: authRef,
        description: description
      };

      if (type === 'Supplementary') {
        const particulars = document.getElementById('adjustSubCategory').value;
        if (!particulars) {
          showBudgetAlert('Particulars is required.', 'error');
          return;
        }
        payload.particulars = particulars;
      } else {
        const fromParticulars = document.getElementById('reallocFromSubCategory').value;
        const toParticulars = document.getElementById('reallocToSubCategory').value;
        if (!fromParticulars || !toParticulars) {
          showBudgetAlert('From and To particulars are required.', 'error');
          return;
        }
        if (fromParticulars === toParticulars) {
          showBudgetAlert('From and To must be different.', 'error');
          return;
        }
        payload.fromParticulars = fromParticulars;
        payload.toParticulars = toParticulars;
      }

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showBudgetAlert('App runtime missing. Open the web app via the deployed URL.', 'error');
        return;
      }

      showBudgetAlert('Saving adjustment...', 'info');
      google.script.run
        .withSuccessHandler(function(result) {
          closeBudgetAdjustmentModal();
          showBudgetAlert('Adjustment saved (' + (result ? result.count : 0) + ' rows).', 'success');
        })
        .withFailureHandler(function(error) {
          showBudgetAlert(error.message || 'Failed to save adjustment.', 'error');
        })
        .saveBudgetAdjustment(payload);
    }

    function formatAmount(value) {
      const amount = Number(value || 0);
      if (!Number.isFinite(amount)) return '';
      return amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function downloadBase64File(base64, filename, mimeType) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const blob = new Blob([bytes], { type: mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function bindResultActions() {
      const container = document.getElementById('searchResults');
      if (!container) return;

      container.onclick = function(event) {
        const editBtn = event.target.closest('.edit-transaction-btn');
        if (editBtn) {
          const batchId = String(editBtn.dataset.batchId || '').trim();
          if (batchId) {
            loadJournalBatch(batchId);
            return;
          }
          const rowId = Number(editBtn.dataset.rowId);
          if (!rowId) {
            showAlert('Invalid transaction row.', 'error');
            return;
          }
          loadJournalRow(rowId);
          return;
        }

        const reverseBtn = event.target.closest('.reverse-transaction-btn');
        if (reverseBtn) {
          const batchId = String(reverseBtn.dataset.batchId || '').trim();
          if (batchId) {
            confirmReverseBatch(batchId);
            return;
          }
          const rowId = Number(reverseBtn.dataset.rowId);
          if (!rowId) {
            showAlert('Invalid transaction row.', 'error');
            return;
          }
          confirmReverseRow(rowId);
        }
      };
    }

    function groupSearchResults(results) {
      const groups = {};
      results.forEach(item => {
        const key = String(item.batchId || '').trim() || String(item.rowId || '').trim();
        if (!key) return;
        if (!groups[key]) {
          groups[key] = { batchId: item.batchId || '', items: [], rowIds: [], totalDebit: 0, totalCredit: 0 };
        }
        const debit = Number(item.debit || 0) || 0;
        const credit = Number(item.credit || 0) || 0;
        groups[key].items.push(item);
        groups[key].rowIds.push(item.rowId);
        groups[key].totalDebit += debit;
        groups[key].totalCredit += credit;
      });

      return Object.values(groups).map(group => {
        const items = group.items;
        const preferred = items.find(entry => !String(entry.accountCode || '').trim()) || items[0] || {};
        const refNo = items.find(entry => String(entry.refNo || '').trim()) || preferred;
        const bankRef = items.find(entry => String(entry.bankRef || '').trim()) || preferred;
        return Object.assign({}, preferred, {
          batchId: group.batchId || preferred.batchId || '',
          rowId: preferred.rowId,
          refNo: refNo ? refNo.refNo : '',
          bankRef: bankRef ? bankRef.bankRef : '',
          totalDebit: formatAmount(group.totalDebit),
          totalCredit: formatAmount(group.totalCredit),
          lineCount: items.length
        });
      }).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    }

      if (!select) return;
      select.innerHTML = rows.map((row, index) => {
        const labelPart = row.particulars || row.accountCode || 'Line';
        const debit = formatAmount(row.debit || 0);
        const credit = formatAmount(row.credit || 0);
        return `<option value="${index}">${labelPart} (Dr ${debit} / Cr ${credit})</option>`;
      }).join('');
      select.onchange = function() {
        const idx = Number(select.value);

      };
      select.value = '0';

    function resetEditBatchToggle() {

    function setEditBatchSummary(rows) {
      if (!rows || !rows.length) return;
      const typeField = document.getElementById('editTransactionType');
      const totalsField = document.getElementById('editBatchTotals');
      const totals = rows.reduce((acc, item) => {
        acc.debit += Number(item.debit || 0) || 0;
        acc.credit += Number(item.credit || 0) || 0;
        return acc;
      }, { debit: 0, credit: 0 });
      if (typeField) typeField.value = resolveTransactionType(rows);
      if (totalsField) totalsField.value = `Dr ${formatAmount(totals.debit)} / Cr ${formatAmount(totals.credit)}`;
      setReverseButtonsState(rows);
    }

    function resolveTransactionType(rows) {
      const firstBatch = String(rows[0]?.batchId || '').trim();
      if (firstBatch.startsWith('JRN-')) return 'Journal Entry';
      const bankRow = rows.find(item => String(item.accountCode || '').trim());
      if (!bankRow) return 'Journal Entry';
      const debit = Number(bankRow.debit || 0) || 0;
      const credit = Number(bankRow.credit || 0) || 0;
      if (debit > 0 && credit === 0) return 'Receipt';
      if (credit > 0 && debit === 0) return 'Payment';
      return 'Transaction';
    }

    function startSessionMonitoring() {
      const TIMEOUT_MS = 30 * 60 * 1000;
      const WARNING_MS = 60 * 1000;

      function resetActivity() {
        lastActivity = Date.now();
      }

      ['mousedown', 'keydown', 'scroll', 'touchstart'].forEach(eventName => {
        document.addEventListener(eventName, resetActivity, true);
      });

      sessionCheckInterval = setInterval(function() {
        const now = Date.now();
        const inactiveTime = now - lastActivity;
        const timeRemaining = TIMEOUT_MS - inactiveTime;

        if (timeRemaining <= 0) {
          clearInterval(sessionCheckInterval);
          clearInterval(countdownInterval);

          google.script.run
            .withSuccessHandler(function() {
              window.location.href = window.location.origin + window.location.pathname + '?expired=true';
            })
            .logout();
        } else if (timeRemaining <= WARNING_MS) {
          document.getElementById('sessionTimer').classList.add('warning');
        } else {
          document.getElementById('sessionTimer').classList.remove('warning');
          document.getElementById('timeRemaining').textContent = 'Session active';
        }
      }, 10000);

      countdownInterval = setInterval(function() {
        const now = Date.now();
        const inactiveTime = now - lastActivity;
        const timeRemaining = TIMEOUT_MS - inactiveTime;

        if (timeRemaining <= WARNING_MS && timeRemaining > 0) {
          const seconds = Math.floor(timeRemaining / 1000);
          const minutes = Math.floor(seconds / 60);
          const secs = seconds % 60;
          document.getElementById('timeRemaining').textContent =
            `Expires in ${minutes}:${secs.toString().padStart(2, '0')}`;
        }
      }, 1000);
    }

        financialYear: document.getElementById('editSupplierFinancialYear').value,

    function removePOLine(lineNum) {
      const line = document.getElementById('poLine' + lineNum);
      if (line) {
        line.remove();
        calculatePOTotal();

    function calculatePOTotal() {
      const lines = document.querySelectorAll('.po-line');
      let total = 0;

      lines.forEach(line => {
        const qty = parseFloat(line.querySelector('.po-line-qty').value) || 0;
        const price = parseFloat(line.querySelector('.po-line-price').value) || 0;
        const lineTotal = qty * price;
        line.querySelector('.po-line-total').value = lineTotal.toFixed(2);
        total += lineTotal;
      });

      document.getElementById('poTotalAmount').textContent = total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function savePurchaseOrderForm() {
      const supplierId = document.getElementById('poSupplier').value;
      const supplierOption = document.getElementById('poSupplier').selectedOptions[0];
      const supplierName = supplierOption ? supplierOption.dataset.name || supplierOption.text : '';

      const data = {
        poDate: document.getElementById('poDate').value,
        financialYear: document.getElementById('poFinancialYear').value,
        deliveryDate: document.getElementById('poDeliveryDate').value,
        supplierId: supplierId,
        supplierName: supplierName,
        description: document.getElementById('poDescription').value.trim(),
        notes: document.getElementById('poNotes').value.trim(),
        lines: []
      };

      // Validate
      if (!data.supplierId) {
        document.getElementById('poFormStatus').innerHTML = '<span style="color:#dc2626;">Please select a supplier.</span>';
        return;
      }
      if (!data.financialYear) {
        document.getElementById('poFormStatus').innerHTML = '<span style="color:#dc2626;">Please select a financial year.</span>';
        return;
      }

      // Collect lines
      const lines = document.querySelectorAll('.po-line');
      if (lines.length === 0) {
        document.getElementById('poFormStatus').innerHTML = '<span style="color:#dc2626;">Please add at least one line item.</span>';
        return;
      }

      let hasValidLine = false;
      lines.forEach(line => {
        const desc = line.querySelector('.po-line-desc').value.trim();
        const qty = parseFloat(line.querySelector('.po-line-qty').value) || 0;
        const price = parseFloat(line.querySelector('.po-line-price').value) || 0;
        const category = line.querySelector('.po-line-category').value;
        const subCategory = line.querySelector('.po-line-subcategory').value;
        const particulars = line.querySelector('.po-line-particulars').value;

        if (desc && qty > 0 && category && subCategory && particulars) {
          hasValidLine = true;
          data.lines.push({
            itemDescription: desc,
            particulars: particulars,
            subCategory: subCategory,
            category: category,
            quantity: qty,
            unit: line.querySelector('.po-line-unit').value,
            unitPrice: price
          });
        }
      });

      if (!hasValidLine) {
        document.getElementById('poFormStatus').innerHTML = '<span style="color:#dc2626;">Each line needs description, quantity, category, sub-category, and particulars.</span>';
        return;
      }

      document.getElementById('poFormStatus').innerHTML = 'Creating purchase order...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            closePOModal();
            loadPurchaseOrders();
            showInfoModal(
              'Purchase Order Created',
              'Purchase Order <strong>' + result.poNumber + '</strong> created successfully.'
            );
          } else {
            document.getElementById('poFormStatus').innerHTML = '<span style="color:#dc2626;">' + (result.message || 'Failed to create PO') + '</span>';
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('poFormStatus').innerHTML = '<span style="color:#dc2626;">Error: ' + error.message + '</span>';
        })
        .savePurchaseOrder(data);
    }

    function loadPendingPOsForGRN() {
      google.script.run
        .withSuccessHandler(function(orders) {
          const select = document.getElementById('grnPO');
          select.innerHTML = '<option value="">-- Select PO --</option>';

          const pendingPOs = (orders || []).filter(po =>
            po.Status === 'Approved' || po.Status === 'Partial'

          if (pendingPOs.length === 0) {

            return;
          }

          pendingPOs.forEach(po => {

            select.innerHTML += `<option value="${po.PO_ID}"
              data-number="${po.PO_Number}"
              data-supplier-id="${po.Supplier_ID}"
              data-supplier-name="${po.Supplier_Name}"
              data-financial-year="${po.Financial_Year || ''}"
              data-amount="${amount}">
              ${po.PO_Number} - ${po.Supplier_Name} (${amount.toLocaleString()})
            </option>`;

          document.getElementById('grnPO').innerHTML = '<option value="">Error loading POs</option>';
        })
        .getPurchaseOrders();

    function loadPOLinesForGRN() {
      const select = document.getElementById('grnPO');
      const poId = select.value;

      if (!poId) {
        document.getElementById('grnPOInfo').style.display = 'none';
        document.getElementById('grnLinesContainer').innerHTML = '<p style="color:#6b7280;font-size:13px;">Select a Purchase Order to see items.</p>';
        grnSelectedPO = null;
        return;
      }

      const option = select.selectedOptions[0];
      document.getElementById('grnSupplierName').textContent = option.dataset.supplierName || '-';
      document.getElementById('grnPOAmount').textContent = parseFloat(option.dataset.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
      document.getElementById('grnPOInfo').style.display = 'block';

      document.getElementById('grnLinesContainer').innerHTML = '<p>Loading PO lines...</p>';

      google.script.run
        .withSuccessHandler(function(po) {
          grnSelectedPO = po;
          if (!po || !po.lines || po.lines.length === 0) {
            document.getElementById('grnLinesContainer').innerHTML = '<p style="color:#6b7280;">No line items found for this PO.</p>';
            return;
          }

          let html = `
            <table class="table" style="font-size:13px;">
              <thead>
                <tr>
                  <th>Item</th>
                  <th style="text-align:right;">Ordered</th>
                  <th style="text-align:right;">Already Received</th>
                  <th style="text-align:right;width:100px;">Qty Received *</th>
                  <th style="width:150px;">Notes</th>
                </tr>
              </thead>
              <tbody>
          `;

          po.lines.forEach((line, idx) => {
            // Support both camelCase (JSON) and snake_case (legacy) property names
            const ordered = parseFloat(line.quantity || line.Quantity) || 0;
            const received = parseFloat(line.receivedQty || line.Received_Qty) || 0;
            const remaining = Math.max(0, ordered - received);
            const lineNo = line.lineNo || line.Line_No || (idx + 1);
            const desc = line.itemDescription || line.Item_Description || '';
            const particulars = line.particulars || line.Particulars || '';
            const subCategory = line.subCategory || line.Sub_Category || '';
            const category = line.category || line.Category || '';
            const price = line.unitPrice || line.Unit_Price || 0;

            html += `
              <tr>
                <td>
                  <strong>${desc}</strong>
                  ${category || subCategory ? `<br><span style="font-size:11px;color:#6b7280;">${[category, subCategory].filter(Boolean).join(' / ')}</span>` : ''}
                  ${particulars ? `<br><span style="font-size:11px;color:#6b7280;">${particulars}</span>` : ''}
                  <input type="hidden" class="grn-line-no" value="${lineNo}">
                  <input type="hidden" class="grn-line-desc" value="${desc}">
                  <input type="hidden" class="grn-line-ordered" value="${ordered}">
                  <input type="hidden" class="grn-line-price" value="${price}">
                  <input type="hidden" class="grn-line-category" value="${category}">
                  <input type="hidden" class="grn-line-subcategory" value="${subCategory}">
                  <input type="hidden" class="grn-line-particulars" value="${particulars}">
                </td>
                <td style="text-align:right;">${ordered}</td>
                <td style="text-align:right;">${received}</td>
                <td>
                  <input type="number" class="grn-line-qty" value="${remaining}" min="0" max="${remaining}"
                    style="width:100%;padding:6px;border:1px solid #e5e7eb;border-radius:4px;text-align:right;">
                </td>
                <td>
                  <input type="text" class="grn-line-note" placeholder="Notes"
                    style="width:100%;padding:6px;border:1px solid #e5e7eb;border-radius:4px;font-size:12px;">
                </td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          document.getElementById('grnLinesContainer').innerHTML = html;
        })
        .withFailureHandler(function(error) {
          document.getElementById('grnLinesContainer').innerHTML = '<p style="color:#dc2626;">Error loading PO lines: ' + error.message + '</p>';
        })
        .getPurchaseOrderWithLines(poId);
    }

    function saveGRNForm() {
      const poSelect = document.getElementById('grnPO');
      const poId = poSelect.value;

      if (!poId) {
        document.getElementById('grnFormStatus').innerHTML = '<span style="color:#dc2626;">Please select a Purchase Order.</span>';
        return;
      }

      const option = poSelect.selectedOptions[0];

      const data = {
        grnDate: document.getElementById('grnDate').value,
        poId: poId,
        poNumber: option.dataset.number || '',
        financialYear: option.dataset.financialYear || '',
        supplierId: option.dataset.supplierId || '',
        supplierName: option.dataset.supplierName || '',
        invoiceNumber: document.getElementById('grnInvoiceNumber').value.trim(),
        invoiceDate: document.getElementById('grnInvoiceDate').value,
        invoiceAmount: document.getElementById('grnInvoiceAmount').value,
        notes: document.getElementById('grnNotes').value.trim(),
        lines: []
      };

      // Collect lines
      const rows = document.querySelectorAll('#grnLinesContainer tbody tr');
      let hasReceivedItems = false;

      rows.forEach(row => {
        const qty = parseFloat(row.querySelector('.grn-line-qty').value) || 0;
        if (qty > 0) {
          hasReceivedItems = true;
          data.lines.push({
            poLineNo: parseInt(row.querySelector('.grn-line-no').value) || 1,
            itemDescription: row.querySelector('.grn-line-desc').value,
            qtyOrdered: row.querySelector('.grn-line-ordered').value,
            qtyReceived: qty,
            qtyAccepted: qty,
            qtyRejected: 0,
            unitPrice: row.querySelector('.grn-line-price').value,
            category: row.querySelector('.grn-line-category').value,
            subCategory: row.querySelector('.grn-line-subcategory').value,
            particulars: row.querySelector('.grn-line-particulars').value,
            rejectionReason: row.querySelector('.grn-line-note').value
          });
        }
      });

      if (!hasReceivedItems) {
        document.getElementById('grnFormStatus').innerHTML = '<span style="color:#dc2626;">Please enter quantities received for at least one item.</span>';
        return;
      }

      document.getElementById('grnFormStatus').innerHTML = 'Recording goods received...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            closeGRNModal();
            loadGRNs();
            showInfoModal(
              'GRN Recorded',
              'GRN <strong>' + result.grnNumber + '</strong> recorded successfully.'
            );
          } else {
            document.getElementById('grnFormStatus').innerHTML = '<span style="color:#dc2626;">' + (result.message || 'Failed to record GRN') + '</span>';
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('grnFormStatus').innerHTML = '<span style="color:#dc2626;">Error: ' + error.message + '</span>';
        })
        .saveGoodsReceivedNote(data);
    }

    function loadPayables() {
      const container = document.getElementById('payablesTableContainer');
      container.innerHTML = '<p>Loading invoices...</p>';

      google.script.run
        .withSuccessHandler(function(payables) {
          const filter = document.getElementById('payablesFilter').value;
          let filtered = payables || [];

          if (filter !== 'all') {
            filtered = filtered.filter(p => p.Status === filter);
          }

          if (filtered.length === 0) {
            container.innerHTML = '<p style="color:#6b7280;">No invoices found.</p>';
            return;
          }

          let html = `
            <table class="table">
              <thead>
                <tr>
                  <th>Invoice #</th>
                  <th>Contact ID</th>
                  <th>Supplier</th>
                  <th>Invoice Date</th>
                  <th>Due Date</th>
                  <th style="text-align:right;">Amount</th>
                  <th style="text-align:right;">Paid</th>
                  <th style="text-align:right;">Balance</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
          `;

          filtered.forEach(p => {
            const amount = parseFloat(p.Amount) || 0;
            const paid = parseFloat(p.Paid_Amount) || 0;
            const balance = parseFloat(p.Balance) || 0;
            const statusClass = p.Status === 'Paid' ? 'status-badge--ok' :
                               p.Status === 'Partial' ? 'status-badge--warn' : 'status-badge--bad';
            const overdue = p.Days_Overdue > 0 ? `<br><span style="color:#dc2626;font-size:11px;">${p.Days_Overdue} days overdue</span>` : '';

            html += `
              <tr>
                <td><strong>${p.Invoice_Number || '-'}</strong></td>
                <td>${p.Supplier_ID || '-'}</td>
                <td>${p.Supplier_Name || '-'}</td>
                <td>${p.Invoice_Date || '-'}</td>
                <td>${p.Due_Date || '-'}${overdue}</td>
                <td style="text-align:right;">${amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td style="text-align:right;">${paid.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td style="text-align:right;font-weight:600;">${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td><span class="status-badge ${statusClass}">${p.Status || 'Unknown'}</span></td>
                <td>
                  <div style="display:flex;gap:4px;">
                    ${p.Status !== 'Paid' && p.Status !== 'Reversed' ? `<button class="btn btn-primary" style="padding:4px 8px;font-size:11px;" onclick="openInvoicePaymentModal('${p.Payable_ID}', '${p.Supplier_Name}', '${p.Invoice_Number}', ${balance})">Pay</button>` : ''}
                    ${p.Status !== 'Reversed' ? `<button class="btn btn-secondary" style="padding:4px 8px;font-size:11px;background:#dc2626;border-color:#dc2626;color:#fff;" onclick="openReversalModal('payable', '${p.Payable_ID}', '${p.Invoice_Number}', '${p.Supplier_Name}', ${amount})">Reverse</button>` : '<span style="color:#6b7280;">Reversed</span>'}
                  </div>
                </td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          container.innerHTML = html;
        })
        .withFailureHandler(function(error) {
          container.innerHTML = '<p style="color:#dc2626;">Failed to load invoices: ' + error.message + '</p>';
        })
        .getPayables();
    }

          if (pending.length === 0) {
            container.innerHTML = '<p style="color:#6b7280;">No outstanding invoices for this supplier.</p>';

    function processInvoicePayment() {
      const payableId = document.getElementById('paymentPayableId').value;
      const paymentDate = document.getElementById('paymentDate').value;
      const amount = parseFloat(document.getElementById('paymentAmount').value) || 0;
      const paymentRef = document.getElementById('paymentRef').value.trim();
      const bankAccount = document.getElementById('paymentBankAccount').value.trim();
      const statusDiv = document.getElementById('paymentFormStatus');

      if (!paymentDate) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Payment date is required.</span>';
        return;
      }

      if (amount <= 0) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Amount must be greater than zero.</span>';
        return;
      }

      if (!paymentRef) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Payment reference is required.</span>';
        return;
      }

      statusDiv.innerHTML = 'Processing payment...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            document.getElementById('invoicePaymentModal').remove();
            showInfoModal(
              'Payment Recorded',
              'Payment recorded successfully!' + (result.journalCreated ? ' Journal entry created.' : '')
            );
            // Refresh the current view
            if (document.getElementById('payablesTableContainer')) {
              loadPayables();
            } else if (document.getElementById('supplierPayablesContainer')) {
              loadSupplierPayables();
            }
          } else {
            statusDiv.innerHTML = '<span style="color:#dc2626;">' + (result.message || 'Failed to process payment') + '</span>';
          }
        })
        .withFailureHandler(function(error) {
          statusDiv.innerHTML = '<span style="color:#dc2626;">Error: ' + error.message + '</span>';
        })
        .recordPayment({
          payableId: payableId,
          paymentDate: paymentDate,
          amount: amount,
          paymentRef: paymentRef,
          bankAccount: bankAccount
        });
    }

    function openReversalModal(type, id, number, name, amount) {
      const typeLabels = {

        'payable': { title: 'Supplier Invoice', entityLabel: 'Supplier' },
        'grn': { title: 'GRN', entityLabel: 'Supplier' }
      };
      const labels = typeLabels[type] || { title: 'Document', entityLabel: 'Entity' };

      const modalHtml = `
        <div class="modal open" id="reversalModal">
          <div class="modal-card" style="max-width:500px;">
            <div class="modal-header" style="background:#dc2626;">
              <span>Reverse ${labels.title}</span>
              <button class="btn btn-secondary" onclick="document.getElementById('reversalModal').remove()" style="padding:6px 12px;font-size:12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;">Close</button>
            </div>
            <div class="modal-body" style="padding:16px;">
              <div style="background:#fef2f2;padding:12px;border-radius:6px;margin-bottom:16px;border:1px solid #fecaca;">
                <p style="font-size:13px;color:#991b1b;margin-bottom:8px;font-weight:600;">⚠️ Warning: This action cannot be undone</p>
                <p style="font-size:12px;color:#b91c1c;">Reversing this ${labels.title.toLowerCase()} will:</p>
                <ul style="font-size:12px;color:#b91c1c;margin:8px 0 0 16px;">
                  <li>Mark the document as "Reversed"</li>
                  <li>Create reversing journal entries</li>
                  ${type === 'grn' ? '<li>Reverse received quantities on the PO</li>' : ''}
                </ul>
              </div>

              <div style="background:#f3f4f6;padding:12px;border-radius:6px;margin-bottom:16px;">
                <p style="font-size:13px;color:#6b7280;">${type === 'grn' ? 'GRN Number' : 'Invoice Number'}</p>
                <p style="font-weight:600;">${number}</p>
                <p style="font-size:13px;color:#6b7280;margin-top:8px;">${labels.entityLabel}</p>
                <p style="font-weight:600;">${name}</p>
                <p style="font-size:13px;color:#6b7280;margin-top:8px;">Amount</p>
                <p style="font-weight:600;font-size:18px;color:#1f2937;">${amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
              </div>

              <input type="hidden" id="reversalType" value="${type}">
              <input type="hidden" id="reversalId" value="${id}">

              <div class="form-group">
                <label for="reversalReason">Reason for Reversal *</label>
                <textarea id="reversalReason" rows="3" placeholder="Enter reason for reversing this ${labels.title.toLowerCase()}..." style="width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:6px;resize:vertical;"></textarea>
              </div>

              <div id="reversalFormStatus" style="min-height:24px;margin:12px 0;"></div>

              <button class="btn" onclick="processReversal()" style="width:100%;background:#dc2626;border-color:#dc2626;color:#fff;">Confirm Reversal</button>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function processReversal() {
      const type = document.getElementById('reversalType').value;
      const id = document.getElementById('reversalId').value;
      const reason = document.getElementById('reversalReason').value.trim();
      const statusDiv = document.getElementById('reversalFormStatus');

      if (!reason) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Reason for reversal is required.</span>';
        return;
      }

      statusDiv.innerHTML = 'Processing reversal...';

      let reversalFn;
      if (type === 'receivable') {
        reversalFn = 'reverseReceivable';
      } else if (type === 'payable') {
        reversalFn = 'reversePayable';
      } else if (type === 'grn') {
        reversalFn = 'reverseGRN';
      }

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            document.getElementById('reversalModal').remove();
            showInfoModal(
              'Reversal Complete',
              result.message || 'Document reversed successfully.'
            );
            // Refresh appropriate view
            if (type === 'receivable') {
              if (document.getElementById('receivablesTableContainer')) loadReceivables();
              else if (document.getElementById('customerReceivablesContainer')) loadCustomerReceivables();
            } else if (type === 'payable') {
              if (document.getElementById('payablesTableContainer')) loadPayables();
              else if (document.getElementById('supplierPayablesContainer')) loadSupplierPayables();
            } else if (type === 'grn') {
              if (document.getElementById('grnTableContainer')) loadGRNs();
            }
          } else {
            statusDiv.innerHTML = '<span style="color:#dc2626;">' + (result.message || 'Failed to reverse document.') + '</span>';
          }
        })
        .withFailureHandler(function(error) {
          statusDiv.innerHTML = '<span style="color:#dc2626;">Error: ' + error.message + '</span>';
        })
        [reversalFn](id, reason);
    }

    function loadStaffAdvanceRows(containerId, includeAction) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '<p style="color:#6b7280;">Loading staff advances...</p>';

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        container.innerHTML = '<p style="color:#6b7280;">App runtime missing.</p>';
        return;
      }

      google.script.run
        .withSuccessHandler(function(staffList) {
          const staffNames = new Set((staffList || []).map(item => String(item.Staff_Name || '').trim()).filter(Boolean));
          google.script.run
            .withSuccessHandler(function(rows) {
              const filtered = (rows || []).filter(row => staffNames.has(String(row.payee || '').trim()));
              const batchIds = filtered.map(row => row.batchId).filter(Boolean);
              if (!batchIds.length) {
                renderStaffAdvanceTable(containerId, filtered, includeAction, {});
                return;
              }
              google.script.run
                .withSuccessHandler(function(totals) {
                  renderStaffAdvanceTable(containerId, filtered, includeAction, totals || {});
                })
                .withFailureHandler(function(error) {
                  container.innerHTML = '<p style="color:#dc2626;">Failed to load surrender totals: ' + (error.message || 'Error') + '</p>';
                })
                .getAdvanceSurrenderTotals(batchIds);
            })
            .withFailureHandler(function(error) {
              container.innerHTML = '<p style="color:#dc2626;">Failed to load staff advances: ' + (error.message || 'Error') + '</p>';
            })
            .getRecentTransactionsByType('Payment', 50);
        })
        .withFailureHandler(function(error) {
          container.innerHTML = '<p style="color:#dc2626;">Failed to load staff list: ' + (error.message || 'Error') + '</p>';
        })
        .getStaff();
    }

    function renderStaffAdvanceTable(containerId, rows, includeAction, totals) {
      const container = document.getElementById(containerId);
      if (!container) return;
      if (!rows || !rows.length) {
        container.innerHTML = '<p style="color:#6b7280;">No staff advances found.</p>';
        return;
      }

      const tableRows = rows.map(row => {
        const advanceAmount = Number(row.amount) || 0;
        const surrendered = Number(totals && totals[row.batchId] || 0);
        const balance = advanceAmount - surrendered;
        const hasBalance = balance > 0;
        const advanceData = JSON.stringify({
          payee: row.payee || '',
          refNo: row.refNo || '',
          batchId: row.batchId || '',
          amount: advanceAmount,
          balance: balance,
          financialYear: row.financialYear || '',
          particulars: row.particulars || '',
          subCategory: row.subCategory || '',
          category: row.category || ''
        }).replace(/'/g, "\\'").replace(/"/g, '&quot;');

        return `
          <tr>
            <td data-label="Date">${row.date || ''}</td>
            <td data-label="Payee">${row.payee || ''}</td>
            <td data-label="Particulars">${row.particulars || ''}</td>
            <td data-label="Sub-Category">${row.subCategory || ''}</td>
            <td data-label="Category">${row.category || ''}</td>
            <td data-label="Amount">${formatPerformanceAmount(advanceAmount)}</td>
            <td data-label="Ref No">${row.refNo || ''}</td>
            <td data-label="Advance ID" style="font-family:monospace;font-size:11px;color:#6b7280;">${row.batchId || ''}</td>
            <td data-label="Balance" style="color:${hasBalance ? '#059669' : '#6b7280'};font-weight:${hasBalance ? '600' : '400'};">${formatPerformanceAmount(balance)}</td>
            <td data-label="Action">
              ${hasBalance ? `<button class="btn btn-primary" style="background:#059669;padding:4px 10px;font-size:12px;" type="button" onclick="startStaffSurrender('${advanceData}')">Surrender</button>` : '<span style="color:#6b7280;font-size:12px;">Cleared</span>'}
            </td>
          </tr>
        `;
      }).join('');

      container.innerHTML = `
        <table class="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Payee</th>
              <th>Particulars</th>
              <th>Sub-Category</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Ref No</th>
              <th>Advance ID</th>
              <th>Balance</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      `;
    }

    function startStaffSurrender(advanceDataJson) {
      let advanceData;
      try {
        advanceData = JSON.parse(advanceDataJson.replace(/&quot;/g, '"'));
      } catch (e) {
        showAlert('Invalid advance data.', 'error');
        return;
      }

      const batchKey = String(advanceData.batchId || '').trim();
      const originalAmount = Number(advanceData.amount) || 0;
      if (!batchKey) {
        showAlert('Missing advance reference for surrender.', 'error');
        return;
      }

      google.script.run
        .withSuccessHandler(function(totals) {
          const used = Number(totals && totals[batchKey] || 0);
          const remaining = Math.max(0, originalAmount - used);
          if (remaining <= 0) {
            showAlert('No remaining balance to surrender for this advance.', 'error');
            return;
          }

          const finalizeSurrender = function(bankInfo) {
            const bankData = bankInfo || {};
            window.pendingJournalPayee = { type: 'Staff', name: advanceData.payee || '' };
            window.pendingJournalYear = advanceData.financialYear || '';
            window.pendingJournalTemplate = {
              amount: remaining,
              originalAmount: originalAmount,
              surrendered: used,
              advanceId: batchKey,
              refNo: advanceData.refNo || '',
              particulars: advanceData.particulars || '',
              subCategory: advanceData.subCategory || '',
              category: advanceData.category || '',
              payee: advanceData.payee || '',
              bankParticulars: bankData.particulars || '',
              bankSubCategory: bankData.subCategory || '',
              bankCategory: bankData.category || '',
              bankDescription: bankData.description || ''
            };
            window.pendingJournalNote = `Advance: ${batchKey} | Original: ${formatPerformanceAmount(originalAmount)} | Surrendered: ${formatPerformanceAmount(used)} | Balance: ${formatPerformanceAmount(remaining)}`;
            openTxnJournalModal();
            setTimeout(function() {
              if (window.pendingJournalNote) {
                setJournalStatus(window.pendingJournalNote);
                window.pendingJournalNote = null;
              }
            }, 300);
          };

          google.script.run
            .withSuccessHandler(function(bankInfo) {
              finalizeSurrender(bankInfo);
            })
            .withFailureHandler(function() {
              finalizeSurrender({});
            })
            .getAdvanceBankClassification(batchKey);
        })
        .withFailureHandler(function(error) {
          showAlert(error.message || 'Failed to load surrender balance.', 'error');
        })
        .getAdvanceSurrenderTotals([batchKey]);
    }

    function removeInvoiceLine(lineNum) {
      const line = document.getElementById('invoiceLine' + lineNum);
      if (line) {
        line.remove();
        calculateInvoiceTotal();
      }
    }

    function calculateInvoiceTotal() {
      const lines = document.querySelectorAll('.invoice-line');
      let total = 0;
      lines.forEach(line => {
        const qty = parseFloat(line.querySelector('.invoice-line-qty').value) || 0;
        const rate = parseFloat(line.querySelector('.invoice-line-rate').value) || 0;
        const lineTotal = qty * rate;
        line.querySelector('.invoice-line-total').value = lineTotal.toFixed(2);
        total += lineTotal;
      });
      const totalEl = document.getElementById('invoiceTotalAmount');
      if (totalEl) {
        totalEl.textContent = total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      return total;
    }

    function loadNextCustomerInvoiceNumber() {
      google.script.run
        .withSuccessHandler(function(nextNumber) {
          const input = document.getElementById('invoiceNumber');
          if (input) input.value = nextNumber || '';
        })
        .withFailureHandler(function(error) {
          const statusDiv = document.getElementById('invoiceFormStatus');
          if (statusDiv) {
            statusDiv.innerHTML = '<span style="color:#dc2626;">Failed to load invoice number: ' + error.message + '</span>';
          }
        })
        .getNextCustomerInvoiceNumber();
    }

    function saveInvoice() {
      const customerSelect = document.getElementById('invoiceCustomer');
      const customerId = customerSelect.value;
      const amount = calculateInvoiceTotal();
      const statusDiv = document.getElementById('invoiceFormStatus');
      const invoiceLines = Array.from(document.querySelectorAll('.invoice-line'));

      if (!customerId) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Please select a customer.</span>';
        return;
      }
      if (amount <= 0) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Total amount must be greater than zero.</span>';
        return;
      }
      if (!invoiceLines.length) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Add at least one line item.</span>';
        return;
      }

      const selectedOption = customerSelect.selectedOptions[0];
      const lineItems = [];
      for (let i = 0; i < invoiceLines.length; i++) {
        const line = invoiceLines[i];
        const particulars = line.querySelector('.invoice-line-particulars').value;
        const qty = parseFloat(line.querySelector('.invoice-line-qty').value) || 0;
        const rate = parseFloat(line.querySelector('.invoice-line-rate').value) || 0;
        const lineTotal = qty * rate;
        if (!particulars) {
          statusDiv.innerHTML = '<span style="color:#dc2626;">Each line needs particulars.</span>';
          return;
        }
        if (qty <= 0 || rate < 0 || lineTotal <= 0) {
          statusDiv.innerHTML = '<span style="color:#dc2626;">Each line must have Qty and Rate greater than zero.</span>';
          return;
        }
        lineItems.push({
          description: line.querySelector('.invoice-line-desc').value.trim(),
          category: line.querySelector('.invoice-line-category').value,
          subCategory: line.querySelector('.invoice-line-subcategory').value,
          particulars: particulars,
          quantity: qty,
          rate: rate,
          total: lineTotal
        });
      }
      const firstParticulars = lineItems[0] ? lineItems[0].particulars : '';
      const data = {
        customerId: customerId,
        customerName: selectedOption.dataset.name || '',
        invoiceNumber: document.getElementById('invoiceNumber').value.trim(),
        invoiceDate: document.getElementById('invoiceDate').value,
        financialYear: document.getElementById('invoiceFinancialYear').value,
        paymentTerms: document.getElementById('invoicePaymentTerms').value,
        particulars: firstParticulars,
        description: document.getElementById('invoiceDescription').value.trim(),
        amount: amount,
        lineItems: lineItems
      };

      statusDiv.innerHTML = 'Creating invoice...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            showInfoModal(
              'Invoice Created',
              'Invoice <strong>' + result.invoiceNumber + '</strong> created successfully.'
            );
            closeIssueInvoiceModal();
            renderOutstandingInvoicesContent();
          } else {
            statusDiv.innerHTML = '<span style="color:#dc2626;">' + (result.message || 'Failed to create invoice') + '</span>';
          }
        })
        .withFailureHandler(function(error) {
          statusDiv.innerHTML = '<span style="color:#dc2626;">Error: ' + error.message + '</span>';
        })
        .createReceivable(data);
    }

    function loadReceivables() {

      google.script.run
        .withSuccessHandler(function(receivables) {
          const filter = document.getElementById('receivablesFilter').value;
          let filtered = receivables || [];

          if (filter !== 'all') {
            filtered = filtered.filter(r => r.Status === filter);
          }

          if (filtered.length === 0) {
            container.innerHTML = '<p style="color:#6b7280;">No invoices found.</p>';
            return;
          }

          let html = `
            <table class="table">
              <thead>
                <tr>
                  <th>Invoice #</th>
                  <th>Contact ID</th>
                  <th>Customer</th>
                  <th>Invoice Date</th>
                  <th>Due Date</th>
                  <th style="text-align:right;">Amount</th>
                  <th style="text-align:right;">Received</th>
                  <th style="text-align:right;">Balance</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
          `;

            const balance = parseFloat(r.Balance) || 0;
            const statusClass = r.Status === 'Paid' ? 'status-badge--ok' :
                               r.Status === 'Partial' ? 'status-badge--warn' : 'status-badge--bad';
            const overdue = r.Days_Overdue > 0 ? `<br><span style="color:#dc2626;font-size:11px;">${r.Days_Overdue} days overdue</span>` : '';

            html += `
              <tr>
                <td><strong>${r.Invoice_Number || '-'}</strong></td>
                <td>${r.Customer_ID || '-'}</td>
                <td>${r.Customer_Name || '-'}</td>
                <td>${r.Invoice_Date || '-'}</td>
                <td>${r.Due_Date || '-'}${overdue}</td>
                <td style="text-align:right;">${amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td style="text-align:right;">${received.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td style="text-align:right;font-weight:600;">${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td><span class="status-badge ${statusClass}">${r.Status || 'Unknown'}</span></td>
                <td>
                  <div style="display:flex;gap:4px;">
                    ${r.Status !== 'Paid' && r.Status !== 'Reversed' ? `<button class="btn btn-primary" style="padding:4px 8px;font-size:11px;" onclick="openInvoiceReceiptModal('${r.Receivable_ID}', '${r.Customer_Name}', '${r.Invoice_Number}', ${balance})">Receive</button>` : ''}
                    ${r.Status !== 'Paid' && r.Status !== 'Reversed' ? `<button class="btn btn-secondary" style="padding:4px 8px;font-size:11px;" onclick="openAdvanceApplyModal('${r.Receivable_ID}', '${r.Customer_ID}', '${r.Customer_Name}', '${r.Invoice_Number}', ${balance})">Apply Advance</button>` : ''}
                    ${r.Status !== 'Reversed' ? `<button class="btn btn-secondary" style="padding:4px 8px;font-size:11px;background:#dc2626;border-color:#dc2626;color:#fff;" onclick="openReversalModal('receivable', '${r.Receivable_ID}', '${r.Invoice_Number}', '${r.Customer_Name}', ${amount})">Reverse</button>` : '<span style="color:#6b7280;">Reversed</span>'}
                  </div>
                </td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          container.innerHTML = html;
        })
        .withFailureHandler(function(error) {
          container.innerHTML = '<p style="color:#dc2626;">Failed to load invoices: ' + error.message + '</p>';

    function loadCustomerReceivables() {
      const customerId = document.getElementById('receiptCustomerSelect').value;
      const container = document.getElementById('customerReceivablesContainer');

      if (!customerId) {
        container.innerHTML = '<p style="color:#6b7280;">Select a customer to view outstanding invoices.</p>';

      container.innerHTML = '<p>Loading invoices...</p>';

      google.script.run
        .withSuccessHandler(function(receivables) {
          const pending = (receivables || []).filter(r => r.Status !== 'Paid');

          if (pending.length === 0) {
            container.innerHTML = '<p style="color:#6b7280;">No outstanding invoices for this customer.</p>';
            return;
          }

          let totalOutstanding = 0;
          let html = `
            <table class="table" style="margin-bottom:16px;">
              <thead>
                <tr>
                  <th>Invoice #</th>
                  <th>Contact ID</th>
                  <th>Invoice Date</th>
                  <th>Due Date</th>
                  <th style="text-align:right;">Amount</th>
                  <th style="text-align:right;">Balance</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
          `;

          pending.forEach(r => {
            const balance = parseFloat(r.Balance) || 0;
            totalOutstanding += balance;
            const overdue = r.Days_Overdue > 0 ? `<span style="color:#dc2626;font-size:11px;">(${r.Days_Overdue}d overdue)</span>` : '';

            html += `
              <tr>
                <td><strong>${r.Invoice_Number || '-'}</strong></td>

                <td>${r.Invoice_Date || '-'}</td>
                <td>${r.Due_Date || '-'} ${overdue}</td>
                <td style="text-align:right;">${parseFloat(r.Amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td style="text-align:right;font-weight:600;">${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td><span class="status-badge ${r.Status === 'Partial' ? 'status-badge--warn' : 'status-badge--bad'}">${r.Status}</span></td>

                  <button class="btn btn-secondary" style="padding:4px 8px;font-size:11px;" onclick="openAdvanceApplyModal('${r.Receivable_ID}', '${r.Customer_ID}', '${r.Customer_Name}', '${r.Invoice_Number}', ${balance})">Apply Advance</button>
