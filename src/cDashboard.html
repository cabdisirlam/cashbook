                <p style="font-weight:600;">${invoiceNumber}</p>
                <p style="font-size:13px;color:#0f172a;margin-top:8px;">Outstanding Balance</p>
                <p style="font-weight:600;font-size:18px;color:#0f172a;">${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
              </div>

              <div class="form-group">
                <label for="advanceSelect">Advance</label>
                <select id="advanceSelect" style="width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:6px;">
                  <option value="">Loading advances...</option>
                </select>
              </div>

              <div class="form-group">
                <label for="advanceApplyDate">Date</label>
                <input type="date" id="advanceApplyDate" value="${today}" style="width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:6px;">
              </div>

              <div class="form-group">
                <label for="advanceApplyAmount">Amount</label>
                <input type="number" id="advanceApplyAmount" min="0.01" step="0.01" style="width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:6px;">
                <div id="advanceApplyHint" style="font-size:12px;color:#6b7280;margin-top:6px;"></div>
              </div>

              <div id="advanceApplyStatus" style="font-size:12px;color:#6b7280;margin-top:8px;"></div>
            </div>
            <div class="modal-footer" style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid #e5e7eb;">
              <button class="btn btn-secondary" onclick="document.getElementById('advanceApplyModal').remove()">Cancel</button>
              <button class="btn btn-primary" id="advanceApplyBtn">Apply</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);

      const select = document.getElementById('advanceSelect');
      const amountInput = document.getElementById('advanceApplyAmount');
      const hint = document.getElementById('advanceApplyHint');
      const status = document.getElementById('advanceApplyStatus');
      const applyBtn = document.getElementById('advanceApplyBtn');

      const updateAmountDefaults = function() {
        const option = select.options[select.selectedIndex];
        if (!option || !option.value) {
          amountInput.value = '';
          amountInput.max = '';
          hint.textContent = '';
          return;
        }
        const remaining = parseFloat(option.getAttribute('data-remaining')) || 0;
        const maxApply = Math.min(balance, remaining);
        amountInput.max = maxApply.toFixed(2);
        amountInput.value = maxApply.toFixed(2);
        hint.textContent = `Available advance balance: ${formatPerformanceAmount(remaining)}`;
      };

      select.addEventListener('change', updateAmountDefaults);

      status.textContent = 'Loading advances...';
      applyBtn.disabled = true;
      google.script.run
        .withSuccessHandler(function(advances) {
          const list = advances || [];
          select.innerHTML = '<option value="">-- Select Advance --</option>';
          if (!list.length) {
            status.textContent = 'No available advances for this customer.';
            return;
          }
          list.forEach(function(a) {
            const option = document.createElement('option');
            option.value = a.advanceId || '';
            option.setAttribute('data-remaining', String(a.remaining || 0));
            option.textContent = `${a.advanceId} | ${a.particulars || 'Advance'} | Bal ${formatPerformanceAmount(a.remaining)}`;
            select.appendChild(option);
          });
          status.textContent = '';
          applyBtn.disabled = false;
          select.value = list[0].advanceId || '';
          updateAmountDefaults();
        })
        .withFailureHandler(function(error) {
          select.innerHTML = '<option value="">-- Select Advance --</option>';
          status.textContent = error.message || 'Failed to load advances.';
        })
        .getCustomerAdvances({ contactId: customerId, customerName: customerName });

      applyBtn.addEventListener('click', function() {
        const advanceId = select.value.trim();
        const amount = parseFloat(amountInput.value) || 0;
        if (!advanceId) {
          status.textContent = 'Select an advance to apply.';
          return;
        }
        if (amount <= 0) {
          status.textContent = 'Enter a valid amount.';
          return;
        }
        status.textContent = 'Applying advance...';
        applyBtn.disabled = true;
        google.script.run
          .withSuccessHandler(function(result) {
            if (!result || !result.success) {
              status.textContent = (result && result.message) || 'Failed to apply advance.';
              applyBtn.disabled = false;
              return;
            }
            document.getElementById('advanceApplyModal').remove();
            if (document.getElementById('receivablesTableContainer')) {
              loadReceivables();
            }
            if (document.getElementById('customerReceivablesContainer')) {
              loadCustomerReceivables();
            }
          })
          .withFailureHandler(function(error) {
            status.textContent = error.message || 'Failed to apply advance.';
            applyBtn.disabled = false;
          })
          .applyReceivableAdvance(receivableId, {
            advanceId: advanceId,
            amount: amount,
            date: document.getElementById('advanceApplyDate').value
          });
      });
    }

    function loadInvoiceBankAccounts(selectId, selectedValue) {
      const select = document.getElementById(selectId);
      if (!select) return;
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        return;
      }
      google.script.run
        .withSuccessHandler(function(data) {
          const accounts = data && data.accounts ? data.accounts : [];
          fillSelectOptions(selectId, accounts);
          if (selectedValue) select.value = selectedValue;
        })
        .withFailureHandler(function() {
          // Keep the fallback placeholder if accounts fail to load.
        })
        .getDropdownData();
    }

    function processInvoiceReceipt() {
      const receivableId = document.getElementById('receiptReceivableId').value;
      const receiptDate = document.getElementById('receiptDate').value;
      const amount = parseFloat(document.getElementById('receiptAmount').value) || 0;
      const receiptRef = document.getElementById('receiptRef').value.trim();
      const bankAccount = document.getElementById('receiptBankAccount').value.trim();
      const statusDiv = document.getElementById('receiptFormStatus');

      if (!receiptDate) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Receipt date is required.</span>';
        return;
      }
      if (amount <= 0) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Amount must be greater than zero.</span>';
        return;
      }
      if (!receiptRef) {
        statusDiv.innerHTML = '<span style="color:#dc2626;">Receipt reference is required.</span>';
        return;
      }

      statusDiv.innerHTML = 'Processing receipt...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            document.getElementById('invoiceReceiptModal').remove();
            showInfoModal(
              'Receipt Recorded',
              'Receipt recorded successfully!' + (result.journalCreated ? ' Journal entry created.' : '')
            );
            // Refresh the current view
            if (document.getElementById('receivablesTableContainer')) {
              loadReceivables();
            } else if (document.getElementById('customerReceivablesContainer')) {
              loadCustomerReceivables();
            }
          } else {
            statusDiv.innerHTML = '<span style="color:#dc2626;">' + (result.message || 'Failed to process receipt') + '</span>';
          }
        })
        .withFailureHandler(function(error) {
          statusDiv.innerHTML = '<span style="color:#dc2626;">Error: ' + error.message + '</span>';
        })
        .recordReceipt({
          receivableId: receivableId,
          receiptDate: receiptDate,
          amount: amount,
          receiptRef: receiptRef,
          bankAccount: bankAccount
        });
    }

    // AR Aging Report
    function renderARAgingReportContent() {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = `
        ${renderSectionHero('AR Aging Report', 'View accounts receivable aging summary.')}
        <div class="card card-spacious">
          <div class="panel-header">
            <div>
              <h2 style="margin-bottom:4px;">Accounts Receivable Aging</h2>
              <p style="color:#6b7280;font-size:13px;">Summary of outstanding invoices by age.</p>
            </div>
            <button class="btn btn-secondary" onclick="loadARAgingReport()">Refresh</button>
          </div>
          <div id="arAgingReportContainer" style="margin-top:16px;">
            <p>Loading aging report...</p>
          </div>
        </div>
      `;
      loadARAgingReport();
    }

    function loadARAgingReport() {
      const container = document.getElementById('arAgingReportContainer');
      container.innerHTML = '<p>Loading aging report...</p>';

      google.script.run
        .withSuccessHandler(function(summary) {
          const html = `
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:16px;margin-bottom:24px;">
              <div style="background:#f0fdf4;padding:16px;border-radius:8px;text-align:center;">
                <p style="font-size:12px;color:#166534;margin-bottom:4px;">Current</p>
                <p style="font-size:24px;font-weight:700;color:#166534;">${(summary.current || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
              </div>
              <div style="background:#fefce8;padding:16px;border-radius:8px;text-align:center;">
                <p style="font-size:12px;color:#854d0e;margin-bottom:4px;">1-30 Days</p>
                <p style="font-size:24px;font-weight:700;color:#854d0e;">${(summary.days_1_30 || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
              </div>
              <div style="background:#fff7ed;padding:16px;border-radius:8px;text-align:center;">
                <p style="font-size:12px;color:#c2410c;margin-bottom:4px;">31-60 Days</p>
                <p style="font-size:24px;font-weight:700;color:#c2410c;">${(summary.days_31_60 || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
              </div>
              <div style="background:#fef2f2;padding:16px;border-radius:8px;text-align:center;">
                <p style="font-size:12px;color:#dc2626;margin-bottom:4px;">61-90 Days</p>
                <p style="font-size:24px;font-weight:700;color:#dc2626;">${(summary.days_61_90 || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
              </div>
              <div style="background:#fef2f2;padding:16px;border-radius:8px;text-align:center;border:2px solid #dc2626;">
                <p style="font-size:12px;color:#dc2626;margin-bottom:4px;">Over 90 Days</p>
                <p style="font-size:24px;font-weight:700;color:#dc2626;">${(summary.days_over_90 || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
              </div>
            </div>

            <div style="background:#f0fdf4;padding:16px;border-radius:8px;text-align:center;">
              <p style="font-size:14px;color:#166534;margin-bottom:4px;">Total Receivables</p>
              <p style="font-size:32px;font-weight:700;color:#166534;">${(summary.total || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
            </div>
          `;

          container.innerHTML = html;
        })
        .withFailureHandler(function(error) {
          container.innerHTML = '<p style="color:#dc2626;">Failed to load aging report: ' + error.message + '</p>';
        })
        .getReceivablesAgingSummary();
    }
  </script>
